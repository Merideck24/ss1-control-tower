name: crm-gamification
on:
  push:
    paths: ['crm-gamification/**', '.github/workflows/crm-gamification.yml']
  pull_request:
    paths: ['crm-gamification/**', '.github/workflows/crm-gamification.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crm-gamification
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crm-gamification/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
