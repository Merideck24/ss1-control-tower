<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SS1 CRM y Fidelidad</title>
<link rel="icon" type="image/webp" href="brand/ss1-icon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  /* Diseño SS1 Admin (Vuexy/Vuetify, tema oscuro): menú lateral + barra superior flotante + tarjetas sobre fondo negro, acento dorado. */
  :root {
    color-scheme: dark;
    --bg: #050505; --panel: #111111; --panel-2: #181818; --ink: #e7e3d8; --muted: #9b968a; --line: #2a2a2a;
    --brand: #d5a021; --brand-ink: #000000; --brand-soft: rgba(213, 160, 33, .16); --brand-grad: linear-gradient(72.47deg, #d5a021 22.16%, rgba(213, 160, 33, .72) 76.47%);
    --ok: #28c76f; --bad: #ea5455; --warn: #ff9f43; --info: #00cfe8; --chip: #1d1d1d;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-other: #7d838c;
    --status-warning: #fab219; --status-serious: #ff9f43; --status-critical: #ea5455; --grid: #222222;
    --shadow: 0 3px 9px 1px rgba(0, 0, 0, .2), 0 9px 8px 0 rgba(0, 0, 0, .06), 0 1px 6px 4px rgba(0, 0, 0, .1);
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, .3);
    --radius: 6px; --sidebar: 260px;
    --font: Roboto, "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; font: 15px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: transparent; border: 1px solid rgba(255, 255, 255, .22); border-radius: var(--radius); padding: 7px 12px; color: var(--ink); }
  select { background: var(--panel); }
  select:hover, input:hover, textarea:hover { border-color: rgba(255, 255, 255, .4); }
  textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  button { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: var(--radius); padding: 8px 18px; cursor: pointer; font-weight: 500; font-size: 13.5px; letter-spacing: .06em; text-transform: uppercase; box-shadow: var(--shadow-sm); transition: background .15s, box-shadow .15s; }
  button:hover { filter: brightness(1.08); box-shadow: 0 4px 12px var(--brand-soft); }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent); box-shadow: none; }
  button.ghost:hover { background: var(--brand-soft); }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  select:focus, input:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 1px var(--brand); }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  a { color: var(--brand); }

  /* Layout: menú lateral fijo + contenido */
  .layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 20; }
  .brandbar { display: flex; align-items: center; justify-content: center; padding: 18px 16px 10px; }
  .brandbar img { width: 170px; height: auto; display: block; }
  .sidebar .section { padding: 14px 22px 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  nav#tabs { display: flex; flex-direction: column; gap: 4px; padding: 4px 14px 16px; overflow-y: auto; }
  nav#tabs button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; color: var(--ink); opacity: .86; text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 400; padding: 9px 14px; box-shadow: none; border-radius: var(--radius); }
  nav#tabs button:hover { background: rgba(255, 255, 255, .06); opacity: 1; }
  nav#tabs button svg { width: 22px; height: 22px; flex: none; stroke: currentColor; }
  nav#tabs button[aria-current="page"] { background: var(--brand-grad); color: var(--brand-ink); opacity: 1; font-weight: 500; box-shadow: 0 2px 6px color-mix(in srgb, var(--brand) 35%, transparent); }
  .sidebar .foot { margin-top: auto; padding: 14px 22px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .shell { min-width: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  header.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin-top: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: rgba(17, 17, 17, .88); backdrop-filter: blur(9px); border-radius: var(--radius); box-shadow: var(--shadow); }
  header.topbar h1 { font-size: 17px; font-weight: 500; margin: 0; }
  header.topbar .ctx { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); flex-wrap: wrap; font-size: 13px; }
  header.topbar label { display: flex; gap: 6px; align-items: center; }
  .ctx-panel { display: contents; }
  .ctx-btn { display: none; }
  @media (max-width: 760px) {
    /* #8: cabecera de una sola línea (≈ 52 px); el contexto se abre a pedido y no tapa el contenido */
    header.topbar { margin-top: 8px; gap: 8px; flex-wrap: nowrap; padding: 6px 10px; }
    header.topbar h1 { font-size: 16px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    header.topbar .synth, header.topbar #mode { display: none; }
    .ctx-btn { display: inline-flex; padding: 4px 10px; font-size: 12px; max-width: 46vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-transform: none; letter-spacing: 0; }
    .ctx-panel { display: none; }
    body.ctx-open .ctx-panel { display: flex; flex-direction: column; gap: 8px; position: absolute; top: calc(100% + 6px); right: 0; left: 0; padding: 12px; background: var(--panel); border-radius: var(--radius); box-shadow: var(--shadow); z-index: 16; }
    body.ctx-open .ctx-panel .ctx { margin-left: 0; flex-direction: column; align-items: stretch; }
    header.topbar label { justify-content: space-between; }
    main { padding-block: 14px 32px; }
  }
  .menu-btn { display: none; background: transparent; color: var(--ink); padding: 6px; box-shadow: none; }
  .menu-btn svg { width: 24px; height: 24px; stroke: currentColor; display: block; }
  main { padding-block: 22px 40px; max-width: 1400px; margin: 0 auto; }
  .scrim { display: none; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; height: auto; width: var(--sidebar); transform: translateX(-105%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
    body.nav-open .sidebar { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 19; }
    .menu-btn { display: inline-flex; }
    .shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* Modo embebido en admin.syssoft1.com: el admin pone menú lateral y barra; aquí quedan pestañas horizontales */
  body.embedded .layout { display: block; min-height: 0; }
  body.embedded .sidebar { position: static; height: auto; width: auto; transform: none; box-shadow: none; background: transparent; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
  body.embedded .brandbar, body.embedded .sidebar .section, body.embedded .sidebar .foot, body.embedded .menu-btn, body.embedded header.topbar .ctx, body.embedded #pageTitle { display: none; }
  body.embedded .ctx-btn { display: none !important; }
  body.embedded nav#tabs { flex-direction: row; overflow-x: auto; padding: 12px 0 0; gap: 6px; }
  body.embedded nav#tabs button { width: auto; white-space: nowrap; padding: 8px 14px; }
  body.embedded .shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body.embedded header.topbar { position: static; margin-top: 12px; box-shadow: none; background: transparent; padding: 0; }
  body.embedded main { padding-top: 14px; }
  .profile-grid { grid-template-columns: minmax(240px, 1fr) 2fr; }
  @media (max-width: 760px) { .profile-grid { grid-template-columns: minmax(0, 1fr); } }
  .waiting { padding: 40px 0; text-align: center; color: var(--muted); }

  /* Componentes */
  .flash { padding: 11px 14px; border-radius: var(--radius); background: var(--brand-soft); border-left: 3px solid var(--brand); margin-bottom: 14px; color: var(--ink); }
  .flash.ok { background: rgba(40, 199, 111, .14); border-left-color: var(--ok); } .flash.bad { background: rgba(234, 84, 85, .14); border-left-color: var(--bad); } .flash.warn { background: rgba(255, 159, 67, .14); border-left-color: var(--warn); }
  .trace { white-space: pre-wrap; word-break: break-word; }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background: var(--panel); border-radius: var(--radius); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); color: rgba(231, 227, 216, .92); }
  .card h3 { margin: 0 0 12px; font-size: 17px; color: var(--ink); font-weight: 500; letter-spacing: 0; text-transform: none; }
  .kpi { font-size: 26px; font-weight: 500; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink); font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; background: var(--panel-2); white-space: nowrap; }
  tr:hover td { background: rgba(255, 255, 255, .025); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 99px; background: var(--chip); color: var(--ink); font-size: 12.5px; margin: 1px 2px 1px 0; }
  .chip.brand { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  pre { background: #0a0a0a; border: 1px solid var(--line); padding: 12px; border-radius: var(--radius); overflow: auto; font-size: 12.5px; max-height: 420px; color: var(--ink); }
  .bar { height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  .phone { max-width: 360px; margin: 0 auto; border: 1px solid var(--line); border-radius: 28px; padding: 20px; background: var(--panel); box-shadow: var(--shadow); }
  .scroll { overflow-x: auto; }
  .card ol li { overflow-wrap: anywhere; }
  .row > label { max-width: 100%; }
  .row > label > input:not([type=checkbox]) { max-width: 100%; box-sizing: border-box; }
  .perf-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 16px; }
  .perf-head h2 { font-size: 21px; font-weight: 500; margin: 0; text-wrap: balance; color: var(--ink); }
  .kpis { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .kpi-card { background: var(--panel); border-radius: var(--radius); padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); border-top: 2px solid transparent; }
  .kpi-card:hover { border-top-color: var(--brand); }
  .kpi-card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
  .kpi-card .val { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--ink); }
  .kpi-card .sub { font-size: 12.5px; color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 500; color: var(--ink); border-top: 2px solid var(--brand); background: var(--brand-soft); }
  .funnel-row { display: grid; grid-template-columns: 130px 1fr 120px; gap: 12px; align-items: center; margin: 8px 0; }
  .funnel-row .bar { height: 12px; }
  details summary { cursor: pointer; color: var(--brand); margin-top: 6px; }
  .chart { position: relative; min-width: 0; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: 6px; }
  .chart .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .lbl-end { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; z-index: 2; }
  .chart .tip b { display: block; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .sw.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }
  .alerts { display: grid; gap: 8px; }
  .alert { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: var(--radius); background: var(--panel-2); }
  .alert.sev-critical { border-left-color: var(--status-critical); } .alert.sev-serious { border-left-color: var(--status-serious); } .alert.sev-warning { border-left-color: var(--status-warning); }
  .alert.acked { opacity: .65; }
  .sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; padding-top: 1px; }
  .sev i { width: 10px; height: 10px; display: inline-block; }
  .sev.critical i { background: var(--status-critical); transform: rotate(45deg); }
  .sev.serious i { background: var(--status-serious); border-radius: 2px; }
  .sev.warning i { background: var(--status-warning); border-radius: 50%; }
  .alert .t { font-weight: 600; } .alert .d { color: var(--muted); font-size: 13px; } .alert .a { font-size: 13px; }
  .cfg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 14px; margin-top: 10px; }
  .cfg label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); } .cfg input { width: 100%; }
  td.pb-ok { color: var(--ok); font-weight: 600; }
  @media (max-width: 620px) { .alert { grid-template-columns: 1fr; } }
  dl.defs { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 4px 12px; margin: 10px 0 0; }
  dl.defs dt { font-weight: 600; } dl.defs dd { margin: 0; color: var(--muted); }
  @media (max-width: 620px) { .funnel-row { grid-template-columns: 90px 1fr 80px; } .grid > [style*="span 2"] { grid-column: auto !important; } }
  .bwrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 16px; }
  @media (max-width: 900px) { .bwrap { grid-template-columns: minmax(0, 1fr); } }
  .canvas-scroll { overflow: auto; max-height: 640px; border: 1px solid var(--grid); border-radius: var(--radius); background-color: var(--bg); background-image: radial-gradient(rgba(255, 255, 255, .07) 1px, transparent 1px); background-size: 20px 20px; }
  .canvas { position: relative; }
  .canvas svg { position: absolute; inset: 0; pointer-events: none; overflow: visible; }
  .canvas svg path { fill: none; stroke: rgba(255, 255, 255, .38); stroke-width: 1.6; }
  .canvas svg text { fill: var(--ink-2, #aaa); font-size: 11px; }
  .jnode { position: absolute; width: 200px; height: 76px; background: var(--panel); border: 1px solid rgba(255, 255, 255, .16); border-radius: var(--radius); padding: 8px 10px; box-shadow: var(--shadow-sm); cursor: grab; touch-action: none; user-select: none; font-size: 12.5px; line-height: 1.35; }
  .jnode.sel { border-color: var(--brand); box-shadow: 0 0 0 1px var(--brand); }
  .jnode.err { border-color: var(--status-critical); }
  .jnode.target { outline: 2px dashed var(--brand); outline-offset: 2px; cursor: crosshair; }
  .jnode .t { font-weight: 500; display: flex; gap: 6px; align-items: center; }
  .jnode .s { color: rgba(231, 227, 216, .66); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .jnode .tag { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--brand); }
  .jnode .port { position: absolute; bottom: -9px; width: 18px; height: 18px; padding: 0; border-radius: 50%; font-size: 9px; line-height: 18px; text-transform: none; letter-spacing: 0; box-shadow: none; }
  .jnode .port.on { background: var(--status-warning); }
  .inspector label { display: block; margin-bottom: 10px; font-size: 13px; }
  .inspector label > select, .inspector label > input { display: block; width: 100%; margin-top: 4px; }
  .issues li.error { color: var(--status-critical); } .issues li.warning { color: var(--status-warning); }
  .issues li { cursor: default; } .issues li[data-goto] { cursor: pointer; text-decoration: underline dotted; }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brandbar"><img src="brand/ss1-logo.webp" alt="SS1 SyssoftOne" width="170" height="80"></div>
    <div class="section">CRM y gamificación</div>
    <nav id="tabs" aria-label="Secciones del CRM"></nav>
    <div class="foot">Datos sintéticos de demostración. No son cifras reales.
      <button type="button" class="ghost" id="demoReset" hidden title="Borra los cambios guardados en este navegador y vuelve a los datos iniciales">Restablecer demo</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="shell">
    <header class="topbar">
      <button type="button" class="menu-btn" id="menuBtn" aria-label="Abrir menú" aria-controls="tabs" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="pageTitle">Control Tower</h1>
      <button type="button" class="ghost ctx-btn" id="ctxBtn" aria-expanded="false" aria-controls="ctxPanel" title="Marca, tenant y rol">Contexto ▾</button>
      <span class="chip brand synth">Datos sintéticos</span><span class="chip" id="mode" hidden>Demo en navegador</span>
      <div class="ctx-panel" id="ctxPanel"><label class="brandsel" title="Filtra jugadores, recorridos, rendimiento y Control Tower por marca">Marca <select id="brand"><option value="">Todas</option></select></label>
      <div class="ctx">
        <label>Tenant <select id="tenant"><option>tenant-rumbawin</option><option>tenant-demo-b</option></select></label>
        <label>Rol <select id="role">
          <option value="crm_analyst">Analista CRM</option>
          <option value="approver">Aprobador</option>
          <option value="support">Soporte</option>
          <option value="rg_officer">Juego responsable</option>
          <option value="tenant_admin">Admin de tenant</option>
          <option value="auditor">Auditor</option>
        </select></label>
      </div></div>
    </header>
    <main><div id="flash" class="flash" role="status" hidden></div><div id="view" aria-live="polite"></div></main>
  </div>
</div>

<script>
// pestaña → permiso requerido (null = visible para todos)
const TABS = [
  ['tower', 'Control Tower', null], ['profile', 'Perfil 360', 'players.read'], ['segments', 'Segmentos', 'segments.preview'], ['builder', 'Constructor', null],
  ['approval', 'Aprobación', null], ['analytics', 'Analítica', 'analytics.read'], ['gamification', 'Gamificación', 'gamification.read'], ['loyalty', 'Fidelidad (móvil)', 'players.read'], ['content', 'Plantillas', 'content.read'], ['policies', 'Políticas por mercado', 'policy.read'], ['onsite', 'Contenido en sitio', 'onsite.read'], ['rg', 'Juego responsable', 'rg.monitor'], ['integrations', 'Integraciones', 'integration.read'], ['copilot', 'Copiloto', 'copilot'], ['audit', 'Auditoría', 'audit.read'],
];
let SESSION = { permissions: [], copilot_tools: [], copilot_ask: false };
const can = (p) => p === null || (p === 'copilot' ? SESSION.copilot_tools.length > 0 : SESSION.permissions.includes(p));
function flash(msg, kind = '') {
  const f = $('#flash');
  if (!msg) { f.hidden = true; return; }
  f.className = 'flash ' + kind; f.textContent = msg; f.hidden = false;
}
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// #11: es-CO escribe «K» bajo 10 000 y «k» desde 10 000; se unifica en «k» (y «-» → «−»)
const moneyC = (minor, cur = 'COP') => minor === null || minor === undefined ? '—' : (minor / 100).toLocaleString('es-CO', { style: 'currency', currency: cur, notation: 'compact', maximumFractionDigits: 1 }).replace(/\sK$|K$/, (m) => m.replace('K', 'k')).replace(/^-/, '−');
const pct = (x, d = 1) => x === null || x === undefined ? '—' : (x * 100).toLocaleString('es-CO', { maximumFractionDigits: d, minimumFractionDigits: d }) + ' %';
const int = (n) => (n ?? 0).toLocaleString('es-CO');
/** #11: decimales con coma (es-CO) en toda la interfaz */
const num = (x, d = 1) => x === null || x === undefined ? '—' : Number(x).toLocaleString('es-CO', { maximumFractionDigits: d });
/** puntos porcentuales con signo y coma decimal: +6,8 pp */
const pp = (x, d = 1) => x === null || x === undefined ? '—' : `${x > 0 ? '+' : x < 0 ? '−' : ''}${Math.abs(x * 100).toLocaleString('es-CO', { minimumFractionDigits: d, maximumFractionDigits: d })} pp`;
let perfDays = 60;

}
function chartPlaceholder(id, spec, height = 220) {

function drawCharts() { for (const id of Object.keys(CHARTS)) { const el = document.getElementById(id); if (el) drawLineChart(el, CHARTS[id]); else delete CHARTS[id]; } }
function drawLineChart(el, spec) {
  const W = Math.max(280, el.clientWidth), H = spec.height, narrow = W < 520;
  const m = { l: 58, r: narrow ? 12 : 128, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.x.length;
  const vals = spec.series.flatMap((se) => se.values.filter((v) => v !== null && v !== undefined));
  if (spec.refY !== undefined) vals.push(spec.refY);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals, lo + 1e-9);
  const ticks = niceTicks(lo, hi, narrow ? 4 : 5); lo = ticks[0]; hi = ticks.at(-1);
  const X = (i) => m.l + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const Y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const every = Math.max(1, Math.ceil(n / (narrow ? 4 : 8)));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for (const tk of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(tk)}" y2="${Y(tk)}" stroke="var(--grid)" stroke-width="1"/><text class="axis" x="${m.l - 8}" y="${Y(tk) + 4}" text-anchor="end">${esc(spec.yTick(tk))}</text>`;
  if (lo < 0) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  for (let i = 0; i < n; i += every) svg += `<text class="axis" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(spec.xTick(spec.x[i]))}</text>`;
  if (spec.refY !== undefined) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(spec.refY)}" y2="${Y(spec.refY)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="axis" x="${m.l + 6}" y="${Y(spec.refY) - 6}">${esc(spec.refLabel)}</text>`;
  const ends = [];
  for (const se of spec.series) {
    let d = '', pen = false;
    se.values.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    svg += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = se.values.map((v, i) => (v === null || v === undefined ? -1 : i)).filter((i) => i >= 0).at(-1);
    if (li !== undefined) ends.push({ y: Y(se.values[li]), x: X(li), se, v: se.values[li] });
  }
  if (!narrow && spec.series.length <= 4) {
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 15) ends[k].y = ends[k - 1].y + 15;
    for (const e of ends) svg += `<circle cx="${W - m.r + 8}" cy="${e.y}" r="4" fill="${e.se.color}"/><text class="lbl-end" x="${W - m.r + 16}" y="${e.y + 4}">${esc(e.se.short ?? e.se.label)} · ${esc(spec.yFmt(e.v))}</text>`;
  }
  svg += `<g class="hover" visibility="hidden"><line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1"/>${spec.series.map((se, k) => `<circle class="pt" data-k="${k}" r="5" fill="${se.color}" stroke="var(--panel)" stroke-width="2"/>`).join('')}</g>`;
  svg += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = svg;
  const g = el.querySelector('.hover'), tip = el.querySelector('.tip');
  let cur = -1;
  const show = (i) => {
    cur = Math.max(0, Math.min(n - 1, i));
    g.setAttribute('visibility', 'visible');
    g.querySelector('.xh').setAttribute('x1', X(cur)); g.querySelector('.xh').setAttribute('x2', X(cur));
    g.querySelectorAll('.pt').forEach((c) => { const v = spec.series[c.dataset.k].values[cur]; if (v === null || v === undefined) c.setAttribute('visibility', 'hidden'); else { c.setAttribute('visibility', 'visible'); c.setAttribute('cx', X(cur)); c.setAttribute('cy', Y(v)); } });
    tip.innerHTML = `<b>${esc(spec.xFmt(spec.x[cur]))}</b>${spec.series.map((se) => `<div><span class="sw line" style="background:${se.color}"></span>${esc(se.label)}: <b style="display:inline">${se.values[cur] === null || se.values[cur] === undefined ? '—' : esc(spec.yFmt(se.values[cur]))}</b></div>`).join('')}${spec.tipExtra ? spec.tipExtra(cur) : ''}`;
    tip.hidden = false;
    const tx = X(cur) + 14 + tip.offsetWidth > W ? X(cur) - tip.offsetWidth - 14 : X(cur) + 14;
    tip.style.left = `${Math.max(0, tx)}px`; tip.style.top = `${m.t}px`;
  };
  const hide = () => { g.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const idxAt = (clientX) => Math.round(((clientX - el.getBoundingClientRect().left - m.l) / iw) * (n - 1));
  el.onmousemove = (ev) => show(idxAt(ev.clientX));
  el.onmouseleave = hide;
  el.ontouchstart = el.ontouchmove = (ev) => show(idxAt(ev.touches[0].clientX));

  el.onblur = hide;
}

        ${d.gamification.opt_out ? '' : `<h3>Tienda</h3><div class="row"><span class="chip brand">${int(d.gamification.coins)} monedas</span></div>
          ${d.gamification.store.map((i) => `<div class="row"><span>${esc(i.name)}</span><span class="muted">${int(i.price_coins)} monedas · stock ${int(i.stock)}</span>${can('player.preferences') && i.stock > 0 && d.gamification.coins >= i.price_coins ? `<button class="ghost" data-redeem="${esc(i.id)}">Canjear</button>` : ''}</div>`).join('')}
          ${d.gamification.redemptions.length ? `<div class="muted">Canjes: ${d.gamification.redemptions.map((r) => `${esc(d.gamification.store.find((i) => i.id === r.item_id)?.name ?? 'Artículo')} (${r.status === 'fulfilled' ? 'entregado' : 'reembolsado'})`).join(' · ')}</div>` : ''}
          <h3>Predicciones</h3>${d.gamification.predictions.map((x) => `<div style="margin-bottom:8px"><b>${esc(x.question)}</b><div class="muted">${Date.parse(x.closes_at) > Date.now() ? 'Cierra' : 'Cerró'} el ${new Date(x.closes_at).toLocaleString('es-CO', { weekday: 'long', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit' })}</div><div class="row" style="margin:4px 0 0">${x.my_pick ? `<span class="chip brand">Tu elección: ${esc(x.my_pick)}</span>` : x.status === 'open' && Date.parse(x.closes_at) > Date.now() && can('player.preferences') ? x.options.map((o) => `<button class="ghost" data-pick="${esc(x.id)}" data-opt="${esc(o)}">${esc(o)}</button>`).join('') : '<span class="muted">Sin elección</span>'}${x.status === 'resolved' ? `<span class="muted">Resultado: ${esc(x.resolved_option)}</span>` : ''}</div></div>`).join('') || '<p class="muted">Sin predicciones.</p>'}`}
        <h3>Logros</h3><div class="row">${d.gamification.badge_catalog.map((b) => { const got = d.gamification.badges.find((x) => x.id === b.id); return `<span class="chip ${got ? 'brand' : ''}" style="${got ? '' : 'opacity:.45'}" title="${esc(b.description)}">${esc(b.name)}</span>`; }).join('')}</div>
        <h3>Preferencias</h3><label><input type="checkbox" id="optin" ${d.gamification.opt_out ? '' : 'checked'} ${can('player.preferences') ? '' : 'disabled'}> Recibir avisos de progreso y misiones</label>
        ${can('player.preferences') ? '' : '<p class="muted">Solo soporte o administración pueden cambiarla desde el backoffice.</p>'}</div>`;
      const rid = () => (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()));
      const pid = encodeURIComponent($('#lp').value);
      document.querySelectorAll('[data-ibread]').forEach((b) => b.onclick = async () => { try { await api(`/players/${pid}/inbox/${encodeURIComponent(b.dataset.ibread)}/read`, { method: 'POST' }); load(); } catch (e) { flash(e.message, 'bad'); } });
      document.querySelectorAll('[data-ibarch]').forEach((b) => b.onclick = async () => { try { await api(`/players/${pid}/inbox/${encodeURIComponent(b.dataset.ibarch)}/archive`, { method: 'POST' }); flash('Mensaje archivado.', 'ok'); load(); } catch (e) { flash(e.message, 'bad'); } });
      if ($('#ibreadall')) $('#ibreadall').onclick = async () => { try { const r = await api(`/players/${pid}/inbox/read-all`, { method: 'POST' }); flash(`${r.marked} mensajes marcados como leídos.`, 'ok'); load(); } catch (e) { flash(e.message, 'bad'); } };
      document.querySelectorAll('[data-redeem]').forEach((b) => b.onclick = async () => {
        try { const r = await api('/gamification/store/redeem', { method: 'POST', body: { player_id: $('#lp').value, item_id: b.dataset.redeem, request_id: rid() } }); flash(r.status === 'fulfilled' ? 'Canje entregado.' : `Canje reembolsado: ${r.reason}`, r.status === 'fulfilled' ? 'ok' : 'warn'); load(); }
        catch (e) { flash(e.message, 'bad'); }
      });
      document.querySelectorAll('[data-pick]').forEach((b) => b.onclick = async () => {
        try { await api(`/gamification/predictions/${b.dataset.pick}/pick`, { method: 'POST', body: { player_id: $('#lp').value, option: b.dataset.opt } }); flash(`Elección registrada: ${b.dataset.opt}. No se puede cambiar.`, 'ok'); load(); }
        catch (e) { flash(e.message, 'bad'); }
      });
      document.querySelectorAll('[data-spin]').forEach((b) => b.onclick = async () => {
        try {
          const r = await api(`/gamification/minigames/${b.dataset.spin}/spin`, { method: 'POST', body: { player_id: $('#lp').value, request_id: (crypto.randomUUID ? crypto.randomUUID() : String(Math.random())) } });
          // #4: el premio se muestra junto a la ruleta, en lenguaje del jugador
          const win = r.reward_status !== 'sin_premio';
          const blocked = String(r.reward_status).startsWith('suppressed') || r.reward_status === 'rejected' || r.reward_status === 'failed';
          LAST_SPIN[`${$('#lp').value}|${b.dataset.spin}`] = { nonce: r.nonce, win: win && !blocked,
            title: !win ? 'Esta vez no hubo premio' : blocked ? `Salió: ${r.label}` : `¡Ganaste ${r.label}!`,
            text: !win ? 'Vuelve a intentarlo con tu próxima tirada.' : blocked ? 'No podemos entregar este premio ahora por las reglas de tu cuenta. Consulta con soporte si tienes dudas.' : r.reward_status === 'xp_awarded' ? 'Los puntos ya se sumaron a tu nivel.' : 'El premio ya está en tus recompensas.' };
          load();
        }
        catch (e) { flash(e.message, 'bad'); }
      });
      if ($('#optin')) $('#optin').onchange = async () => {
        try { await api(`/players/${encodeURIComponent($('#lp').value)}/gamification-preference`, { method: 'POST', body: { opt_out: !$('#optin').checked } }); flash($('#optin').checked ? 'Gamificación activada para el jugador.' : 'Gamificación desactivada: sin misiones ni avisos de progreso.', 'ok'); load(); }
        catch (e) { flash(e.message, 'bad'); }
      };
    };
    if (ROUTE.player && [...$('#lp').options].some((o) => o.value === ROUTE.player)) $('#lp').value = ROUTE.player;
    $('#lp').onchange = () => { setRoute({ player: $('#lp').value }); load(); };
    load();
  },
  gamification() {
    document.querySelectorAll('[data-mact]').forEach((b) => b.onclick = async () => {
      try { const m = await api(`/gamification/missions/${b.dataset.mid}/${b.dataset.mact}`, { method: 'POST' }); flash(m.status === 'pending_approval' ? 'Misión enviada a aprobación. La activa otra persona con rol Aprobador.' : m.status === 'active' ? 'Misión activa.' : 'Misión en pausa.', 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    });
    document.querySelectorAll('[data-tfin]').forEach((b) => b.onclick = async () => {
      try { const t = await api(`/gamification/tournaments/${b.dataset.tfin}/finalize`, { method: 'POST' }); flash(`Torneo cerrado: ${t.final.payouts.length} premios, ${t.final.excluded} excluidos. Hash ${t.final.hash.slice(0, 12)}…`, 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    document.querySelectorAll('[data-pres]').forEach((b) => b.onclick = async () => {
      try { const r = await api(`/gamification/predictions/${b.dataset.pres}/resolve`, { method: 'POST', body: { option: b.dataset.opt } }); flash(`Predicción resuelta: ${r.resolved_option}. ${r.payouts} premios pagados.`, 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    document.querySelectorAll('[data-rot]').forEach((b) => b.onclick = async () => {
      try { await api(`/gamification/minigames/${b.dataset.rot}/rotate-seed`, { method: 'POST' }); flash('Semilla rotada: la anterior ya es pública para verificar resultados.', 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    if ($('#msave')) $('#msave').onclick = async () => {
      try { const m = await api('/gamification/missions', { method: 'POST', body: JSON.parse($('#mdraft').value) }); flash(`Borrador «${m.name}» guardado.`, 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    };
  },
  analytics() {
    document.querySelectorAll('[data-nba]').forEach((b) => b.onclick = () => openSegmentWith(JSON.parse(b.dataset.nba)));
    document.querySelectorAll('[data-abr]').forEach((b) => b.onclick = async () => {
      try { await api(`/risk/bonus-abuse/${encodeURIComponent(b.dataset.abr)}/review`, { method: 'POST', body: { status: b.dataset.st, note: $('#abnote').value } });
        flash(`${b.dataset.abr}: ${b.dataset.st === 'cleared' ? 'marcado como falso positivo; recibe bonos normales' : 'abuso confirmado; incentivos pausados'} por 30 días.`, 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    });
  },
  towerCsv() {
    if (!$('#csvload')) return;
    $('#csvfile').onchange = async () => { const f = $('#csvfile').files[0]; if (f) $('#csvtext').value = await f.text(); };
    const run = async (dry) => {
      try {
        const r = await api('/ingest/csv', { method: 'POST', body: { event_type: $('#csvtype').value, csv: $('#csvtext').value, dry_run: dry, mode: $('#csvmode').value } });
        $('#csvout').innerHTML = r.error_count ? `<p class="bad">${int(r.error_count)} filas con error de ${int(r.rows)}:</p><ul class="issues">${r.errors.map((e) => `<li class="error">Línea ${e.line}: ${esc(e.message)}</li>`).join('')}</ul>`
          : `<p class="ok">${dry ? `${int(r.valid)} filas válidas de ${int(r.rows)}.` : `Cargadas ${int(r.applied)} · duplicadas ${int(r.duplicate)} · rechazadas ${int(r.rejected)} (modo ${r.mode === 'historico' ? 'histórico' : 'tiempo real'}).`}</p><p class="muted">${esc(r.note)}</p>`;
      } catch (e) { $('#csvout').innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
    };
    $('#csvcheck').onclick = () => run(true); $('#csvload').onclick = () => run(false);
  },
  copilot() {
    const samples = { query_metric: { metric: 'kyc_verified_rate' }, preview_segment: { rules: { field: 'kyc', op: 'eq', value: 'verified' }, exclusions: { field: 'rg', op: 'neq', value: 'none' } }, validate_policy: { journey: { id: 'j_demo', purpose: 'marketing', trigger: { event_type: 'deposit.settled' }, entry: 'm', nodes: [{ id: 'm', type: 'message', channel: 'inapp', template: 'deposit_progress', next: 'e' }, { id: 'e', type: 'exit' }] } } };
    samples.simulate_journey = { ...samples.validate_policy, synthetic_profile: { rg: 'self_excluded' } };
    samples.save_draft = samples.validate_policy;
    const fill = () => { $('#tin').value = JSON.stringify(samples[$('#tool').value] ?? {}, null, 2); };
    if ($('#tool')) { $('#tool').onchange = fill; fill(); }
    $('#call').onclick = async () => { try { $('#cout').textContent = JSON.stringify(await api('/copilot/tools/' + $('#tool').value, { method: 'POST', body: JSON.parse($('#tin').value) }), null, 2); } catch (e) { $('#cout').textContent = e.message; } };
    if ($('#ask')) $('#ask').onclick = async () => { $('#cout').textContent = 'Consultando…'; try { $('#cout').textContent = JSON.stringify(await api('/copilot/ask', { method: 'POST', body: { question: $('#q').value } }), null, 2); } catch (e) { $('#cout').textContent = e.message; } };
  },
};

async function boot() {
  flash('');
  try { await loadSession(); } catch (e) { flash(e.message, 'bad'); }
  setRoute(); renderTabs(); show();
}
if (window.SS1_STATIC) $('#mode').hidden = false;
if (window.SS1_DEMO) {
  $('#demoReset').hidden = false;
  $('#demoReset').onclick = () => { if (confirm(`Se borrarán ${window.SS1_DEMO.actions()} cambios guardados en este navegador (borradores, aprobaciones, acciones). ¿Continuar?`)) window.SS1_DEMO.reset(); };
}
$('#tenant').onchange = () => { setRoute({ player: null }); boot(); };
$('#role').onchange = () => { setRoute(); boot(); };
$('#brand').onchange = () => { setRoute(); show(); };
// atrás / adelante del navegador: vuelve a la pantalla (y al rol o tenant) de esa entrada
window.addEventListener('popstate', () => {
  const before = [$('#role').value, $('#tenant').value];
  applyRoute(parseRoute());
  if (before[0] !== $('#role').value || before[1] !== $('#tenant').value) boot(); else { renderTabs(); show(); }
});
if (!EMBED.active) {
  let r = parseRoute();
  const saved = store.get(ROUTE_KEY);
  if (!r.tab && saved) { history.replaceState(null, '', saved); r = parseRoute(); }
  applyRoute(r);
  boot();
}
else {
  $('#view').innerHTML = '<p class="waiting">Esperando la sesión de admin.syssoft1.com…</p>';
  setTimeout(() => { if (!EMBED.session) $('#view').innerHTML = '<div class="card bad">No se recibió la sesión del admin. Abre el CRM desde admin.syssoft1.com con un usuario autorizado.</div>'; }, 8000);
}
</script>
</body>
</html>
