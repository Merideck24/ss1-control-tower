<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SS1 CRM y Fidelidad</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #18202b; --muted: #5d6878; --line: #e2e6ec;
    --brand: #0f6b5c; --brand-ink: #ffffff; --warn: #a15c00; --bad: #b3261e; --ok: #1d7a3a; --chip: #eef2f6;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100; --series-other: #8b8f96;
    --status-warning: #fab219; --status-serious: #ec835a; --status-critical: #d03b3b; --grid: #e9ecf1;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f141a; --panel: #161d25; --ink: #e6ebf1; --muted: #9aa6b5; --line: #26303b; --brand: #3fb59e; --brand-ink: #062019; --chip: #1f2933; --warn: #e0a24a; --bad: #f2867f; --ok: #6fd08f; --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-other: #7d838c; --grid: #222b35; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #0f141a; --panel: #161d25; --ink: #e6ebf1; --muted: #9aa6b5; --line: #26303b; --brand: #3fb59e; --brand-ink: #062019; --chip: #1f2933; --warn: #e0a24a; --bad: #f2867f; --ok: #6fd08f; --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-other: #7d838c; --grid: #222b35; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { display: flex; align-items: center; gap: 16px; padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  header h1 { font-size: 16px; margin: 0; }
  header .ctx { margin-left: auto; display: flex; gap: 8px; align-items: center; color: var(--muted); flex-wrap: wrap; }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
  textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12px; }
  button { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  nav { display: flex; gap: 2px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); overflow-x: auto; }
  nav button { background: none; color: var(--muted); border-radius: 0; border-bottom: 2px solid transparent; padding: 10px 12px; white-space: nowrap; }
  nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--brand); }
  main { padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1200px; margin: 0 auto; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  a { color: var(--brand); }
  .flash { padding: 10px 12px; border-radius: 8px; background: var(--chip); margin-bottom: 12px; }
  .trace { white-space: pre-wrap; word-break: break-word; }
  .grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; min-width: 0; }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .03em; }
  .kpi { font-size: 26px; font-weight: 650; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 99px; background: var(--chip); font-size: 12px; margin: 1px 2px 1px 0; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
  pre { background: var(--chip); padding: 10px; border-radius: 8px; overflow: auto; font-size: 12px; max-height: 420px; }
  .bar { height: 12px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--brand); }
  .phone { max-width: 360px; margin: 0 auto; border: 1px solid var(--line); border-radius: 24px; padding: 18px; background: var(--panel); }
  .scroll { overflow-x: auto; }
  .perf-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin: 4px 0 12px; }
  .perf-head h2 { font-size: 18px; margin: 0; text-wrap: balance; }
  .kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .kpi-card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
  .kpi-card .lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .kpi-card .val { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .kpi-card .sub { font-size: 12px; color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 650; border-top: 2px solid var(--line); }
  .funnel-row { display: grid; grid-template-columns: 130px 1fr 110px; gap: 10px; align-items: center; margin: 6px 0; }
  .funnel-row .bar { height: 14px; }
  details summary { cursor: pointer; color: var(--brand); }
  .chart { position: relative; min-width: 0; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: 6px; }
  .chart .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .lbl-end { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; z-index: 2; }
  .chart .tip b { display: block; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .sw.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }
  .alerts { display: grid; gap: 8px; }
  .alert { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 12px; align-items: start; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
  .alert.acked { opacity: .65; }
  .sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; padding-top: 1px; }
  .sev i { width: 10px; height: 10px; display: inline-block; }
  .sev.critical i { background: var(--status-critical); transform: rotate(45deg); }
  .sev.serious i { background: var(--status-serious); border-radius: 2px; }
  .sev.warning i { background: var(--status-warning); border-radius: 50%; }
  .alert .t { font-weight: 600; } .alert .d { color: var(--muted); font-size: 13px; } .alert .a { font-size: 13px; }
  .cfg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 14px; margin-top: 10px; }
  .cfg label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); } .cfg input { width: 100%; }
  td.pb-ok { color: var(--ok); font-weight: 600; }
  @media (max-width: 620px) { .alert { grid-template-columns: 1fr; } }
  dl.defs { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 4px 12px; margin: 10px 0 0; }
  dl.defs dt { font-weight: 600; } dl.defs dd { margin: 0; color: var(--muted); }
  @media (max-width: 620px) { .funnel-row { grid-template-columns: 90px 1fr 80px; } .grid > [style*="span 2"] { grid-column: auto !important; } }
</style>
</head>
<body>
<header>
  <h1>SS1 · CRM, Gamificación e IA</h1>
  <span class="chip">Datos sintéticos</span><span class="chip" id="mode" hidden>Demo en navegador</span>
  <div class="ctx">
    <label>Tenant <select id="tenant"><option>tenant-rumbawin</option><option>tenant-demo-b</option></select></label>
    <label>Rol <select id="role">
      <option value="crm_analyst">Analista CRM</option>
      <option value="approver">Aprobador</option>
      <option value="support">Soporte</option>
      <option value="rg_officer">Juego responsable</option>
      <option value="tenant_admin">Admin de tenant</option>
      <option value="auditor">Auditor</option>
    </select></label>
  </div>
</header>
<nav role="tablist" id="tabs"></nav>
<main><div id="flash" class="flash" role="status" hidden></div><div id="view" aria-live="polite"></div></main>

<script>
// pestaña → permiso requerido (null = visible para todos)
const TABS = [
  ['tower', 'Control Tower', null], ['profile', 'Perfil 360', 'players.read'], ['segments', 'Segmentos', 'segments.preview'], ['builder', 'Constructor', null],
  ['approval', 'Aprobación', null], ['analytics', 'Analítica', 'analytics.read'], ['loyalty', 'Fidelidad (móvil)', 'players.read'], ['copilot', 'Copiloto', 'copilot'], ['audit', 'Auditoría', 'audit.read'],
];
let SESSION = { permissions: [], copilot_tools: [], copilot_ask: false };
const can = (p) => p === null || (p === 'copilot' ? SESSION.copilot_tools.length > 0 : SESSION.permissions.includes(p));
function flash(msg, kind = '') {
  const f = $('#flash');
  if (!msg) { f.hidden = true; return; }
  f.className = 'flash ' + kind; f.textContent = msg; f.hidden = false;
}
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const moneyC = (minor, cur = 'COP') => minor === null || minor === undefined ? '—' : (minor / 100).toLocaleString('es-CO', { style: 'currency', currency: cur, notation: 'compact', maximumFractionDigits: 1 });
const pct = (x, d = 1) => x === null || x === undefined ? '—' : (x * 100).toLocaleString('es-CO', { maximumFractionDigits: d, minimumFractionDigits: d }) + ' %';
const int = (n) => (n ?? 0).toLocaleString('es-CO');
let perfDays = 60;
const CHANNEL = { google: 'Google', meta: 'Meta', affiliate: 'Afiliados', tiktok: 'TikTok', organic: 'Orgánico', all: '' };
const ret = (r) => r.eligible === 0 ? '<span class="muted" title="Ningún FTD tiene aún la antigüedad necesaria">inmadura</span>' : `${pct(r.rate)} <span class="muted">(${r.retained}/${r.eligible})</span>`;
const roiCell = (x) => x === null ? '—' : `<span class="${x >= 0 ? 'ok' : 'bad'}">${x >= 0 ? '+' : ''}${pct(x, 0)}</span>`;

// ---------- Gráficas (SVG propio, sin librerías) ----------
const CHARTS = {};
const CAMPAIGN_SLOT = { meta_prospecting: 1, google_search_brand: 2, afiliados_cpa: 3, tiktok_awareness: 4 };
const campaignColor = (id) => CAMPAIGN_SLOT[id] ? `var(--series-${CAMPAIGN_SLOT[id]})` : 'var(--series-other)';
function niceTicks(min, max, count = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => span / st <= count) ?? 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
function chartPlaceholder(id, spec, height = 220) {
  CHARTS[id] = { ...spec, height };
  const legend = spec.series.length > 1 ? `<div class="legend" aria-hidden="true">${spec.series.map((se) => `<span><span class="sw line" style="background:${se.color}"></span>${esc(se.label)}</span>`).join('')}${spec.refY !== undefined ? `<span><span class="sw line" style="background:var(--muted)"></span>${esc(spec.refLabel)}</span>` : ''}</div>` : '';
  const table = `<details><summary>Ver datos en tabla</summary><div class="scroll"><table><tr><th>${esc(spec.xTitle)}</th>${spec.series.map((se) => `<th class="num">${esc(se.label)}</th>`).join('')}</tr>${spec.x.map((x, i) => `<tr><td>${esc(spec.xFmt(x))}</td>${spec.series.map((se) => `<td class="num">${se.values[i] === null || se.values[i] === undefined ? '—' : esc(spec.yFmt(se.values[i]))}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
  return `${legend}<div class="chart" id="${id}" tabindex="0" role="img" aria-label="${esc(spec.aria)}"></div>${table}`;
}
function drawCharts() { for (const id of Object.keys(CHARTS)) { const el = document.getElementById(id); if (el) drawLineChart(el, CHARTS[id]); else delete CHARTS[id]; } }
function drawLineChart(el, spec) {
  const W = Math.max(280, el.clientWidth), H = spec.height, narrow = W < 520;
  const m = { l: 58, r: narrow ? 12 : 128, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.x.length;
  const vals = spec.series.flatMap((se) => se.values.filter((v) => v !== null && v !== undefined));
  if (spec.refY !== undefined) vals.push(spec.refY);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals, lo + 1e-9);
  const ticks = niceTicks(lo, hi, narrow ? 4 : 5); lo = ticks[0]; hi = ticks.at(-1);
  const X = (i) => m.l + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const Y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const every = Math.max(1, Math.ceil(n / (narrow ? 4 : 8)));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for (const tk of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(tk)}" y2="${Y(tk)}" stroke="var(--grid)" stroke-width="1"/><text class="axis" x="${m.l - 8}" y="${Y(tk) + 4}" text-anchor="end">${esc(spec.yTick(tk))}</text>`;
  if (lo < 0) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  for (let i = 0; i < n; i += every) svg += `<text class="axis" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(spec.xTick(spec.x[i]))}</text>`;
  if (spec.refY !== undefined) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(spec.refY)}" y2="${Y(spec.refY)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="axis" x="${m.l + 6}" y="${Y(spec.refY) - 6}">${esc(spec.refLabel)}</text>`;
  const ends = [];
  for (const se of spec.series) {
    let d = '', pen = false;
    se.values.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    svg += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = se.values.map((v, i) => (v === null || v === undefined ? -1 : i)).filter((i) => i >= 0).at(-1);
    if (li !== undefined) ends.push({ y: Y(se.values[li]), x: X(li), se, v: se.values[li] });
  }
  if (!narrow && spec.series.length <= 4) {
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 15) ends[k].y = ends[k - 1].y + 15;
    for (const e of ends) svg += `<circle cx="${W - m.r + 8}" cy="${e.y}" r="4" fill="${e.se.color}"/><text class="lbl-end" x="${W - m.r + 16}" y="${e.y + 4}">${esc(e.se.short ?? e.se.label)} · ${esc(spec.yFmt(e.v))}</text>`;
  }
  svg += `<g class="hover" visibility="hidden"><line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1"/>${spec.series.map((se, k) => `<circle class="pt" data-k="${k}" r="5" fill="${se.color}" stroke="var(--panel)" stroke-width="2"/>`).join('')}</g>`;
  svg += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" hidden></div>`;
  el.innerHTML = svg;
  const g = el.querySelector('.hover'), tip = el.querySelector('.tip');
  let cur = -1;
  const show = (i) => {
    cur = Math.max(0, Math.min(n - 1, i));
    g.setAttribute('visibility', 'visible');
    g.querySelector('.xh').setAttribute('x1', X(cur)); g.querySelector('.xh').setAttribute('x2', X(cur));
    g.querySelectorAll('.pt').forEach((c) => { const v = spec.series[c.dataset.k].values[cur]; if (v === null || v === undefined) c.setAttribute('visibility', 'hidden'); else { c.setAttribute('visibility', 'visible'); c.setAttribute('cx', X(cur)); c.setAttribute('cy', Y(v)); } });
    tip.innerHTML = `<b>${esc(spec.xFmt(spec.x[cur]))}</b>${spec.series.map((se) => `<div><span class="sw line" style="background:${se.color}"></span>${esc(se.label)}: <b style="display:inline">${se.values[cur] === null || se.values[cur] === undefined ? '—' : esc(spec.yFmt(se.values[cur]))}</b></div>`).join('')}${spec.tipExtra ? spec.tipExtra(cur) : ''}`;
    tip.hidden = false;
    const tx = X(cur) + 14 + tip.offsetWidth > W ? X(cur) - tip.offsetWidth - 14 : X(cur) + 14;
    tip.style.left = `${Math.max(0, tx)}px`; tip.style.top = `${m.t}px`;
  };
  const hide = () => { g.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const idxAt = (clientX) => Math.round(((clientX - el.getBoundingClientRect().left - m.l) / iw) * (n - 1));
  el.onmousemove = (ev) => show(idxAt(ev.clientX));
  el.onmouseleave = hide;
  el.ontouchstart = el.ontouchmove = (ev) => show(idxAt(ev.touches[0].clientX));
  el.onkeydown = (ev) => { if (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft') { ev.preventDefault(); show((cur < 0 ? n - 1 : cur) + (ev.key === 'ArrowRight' ? 1 : -1)); } else if (ev.key === 'Escape') hide(); };
  el.onblur = hide;
}
window.addEventListener('resize', () => { clearTimeout(window.__rz); window.__rz = setTimeout(drawCharts, 120); });

const SEV = { critical: 'Crítica', serious: 'Alta', warning: 'Media' };
const CFG_LABELS = {
  ctr_drop_pct: ['Caída de CTR (%)', 1], ftd_rate_drop_pct: ['Caída de FTD % (%)', 1], cpa_rise_pct: ['Alza de CPA (%)', 1],
  cost_per_ftd_target_minor: ['Objetivo costo por FTD (COP)', 100], payback_target_days: ['Objetivo de payback (días)', 1],
  rg_share_max: ['Máx. restricciones JR (%)', 0.01], min_rg_cases: ['Mín. casos JR', 1], budget_warn: ['Presupuesto bonos: aviso (%)', 0.01],
  budget_serious: ['Presupuesto bonos: alta (%)', 0.01], min_clicks: ['Mín. clics de referencia', 1], min_registrations: ['Mín. registros', 1], spend_missing_days: ['Días sin reporte de inversión', 1],
};
function alertsSection(a) {
  const open = a.alerts.filter((x) => !x.acknowledged), acked = a.alerts.filter((x) => x.acknowledged);
  const counts = Object.keys(SEV).map((k) => [k, open.filter((x) => x.severity === k).length]).filter(([, n]) => n);
  const item = (x) => `<div class="alert ${x.acknowledged ? 'acked' : ''}">
      <span class="sev ${x.severity}"><i aria-hidden="true"></i>${SEV[x.severity]}</span>
      <div><div class="t">${esc(x.title)}</div><div class="d">${esc(x.detail)} <span class="muted">· ${esc(x.window)}</span></div><div class="a"><b>Acción sugerida:</b> ${esc(x.action)}</div>
        ${x.acknowledged ? `<div class="d">Revisada por ${esc(x.acknowledged.by)} · ${new Date(x.acknowledged.at).toLocaleString('es-CO')}${x.acknowledged.note ? ` · «${esc(x.acknowledged.note)}»` : ''}</div>` : ''}</div>
      <div>${!x.acknowledged && can('alerts.ack') ? `<button class="ghost" data-ack="${esc(x.id)}">Marcar revisada</button>` : ''}</div></div>`;
  const cfg = a.config;
  return `<section aria-labelledby="alerts-h" class="card">
    <div class="perf-head"><h2 id="alerts-h">Alertas de KPI</h2>
      <span class="muted">${open.length ? counts.map(([k, n]) => `${n} ${SEV[k].toLowerCase()}${n === 1 ? '' : 's'}`).join(' · ') : 'Sin alertas abiertas'} · evaluadas ${new Date(a.as_of).toLocaleString('es-CO')}</span></div>
    <div class="alerts">${open.map(item).join('') || '<p class="muted">Todas las métricas están dentro de los umbrales.</p>'}</div>
    ${acked.length ? `<details style="margin-top:10px"><summary>Revisadas (${acked.length})</summary><div class="alerts" style="margin-top:8px">${acked.map(item).join('')}</div></details>` : ''}
    <details style="margin-top:10px"><summary>Umbrales${can('alerts.configure') ? ' (editables)' : ''}</summary>
      <p class="muted">Valores iniciales de ejemplo, a calibrar con Marketing y Finanzas. Las caídas de CTR y FTD % solo alertan si además son estadísticamente significativas (z ≥ 1,96).</p>

function trendSection(p) {
  const days = p.daily.map((d) => d.date);
  const dfmt = (d) => new Date(d + 'T12:00:00Z').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' });
  const money = { yFmt: (v) => moneyC(v), yTick: (v) => moneyC(v) };
  const a = chartPlaceholder('chart-money', { aria: `Inversión y NGR diarios de los últimos ${p.window.days} días`, xTitle: 'Día', x: days, xFmt: dfmt, xTick: dfmt, ...money,
    series: [{ label: 'Inversión', short: 'Inversión', color: 'var(--series-1)', values: p.daily.map((d) => d.spend_minor) }, { label: 'NGR de la cohorte', short: 'NGR', color: 'var(--series-2)', values: p.daily.map((d) => d.ngr_minor) }] });
  const b = chartPlaceholder('chart-counts', { aria: 'Registros y FTD diarios', xTitle: 'Día', x: days, xFmt: dfmt, xTick: dfmt, yFmt: (v) => int(v), yTick: (v) => int(v),
    series: [{ label: 'Registros', color: 'var(--series-3)', values: p.daily.map((d) => d.registrations) }, { label: 'FTD', color: 'var(--series-4)', values: p.daily.map((d) => d.ftd) }] }, 170);
  return `<div class="card"><h3>Tendencia diaria · inversión frente a NGR</h3>${a}
    <p class="muted">NGR diario generado por los jugadores captados en el período (apuestas − premios − bonos − impuesto). Al inicio del período la cohorte es pequeña, por eso el NGR crece con el tiempo.</p>
    <h3 style="margin-top:14px">Registros y FTD por día</h3>${b}</div><br>`;
}
function paybackSection(pb) {
  const maxLen = Math.max(1, ...pb.curves.map((c) => c.points.length));
  const xs = Array.from({ length: maxLen }, (_, i) => i);
  const chart = chartPlaceholder('chart-payback', { aria: 'Curvas de payback por campaña: porcentaje de la inversión recuperado según días desde el registro', xTitle: 'Días desde el registro', x: xs,
    xFmt: (d) => `Día ${d}`, xTick: (d) => `D${d}`, yFmt: (v) => pct(v, 0), yTick: (v) => pct(v, 0), refY: 1, refLabel: 'Payback (100 %)',
    series: pb.curves.map((c) => ({ label: c.campaign_name, short: c.campaign_name.split(' · ')[0], color: campaignColor(c.campaign_id), values: xs.map((d) => c.points[d]?.recovered ?? null) })),
    tipExtra: (d) => `<div class="muted" style="margin-top:4px">Cohortes con ${d} días o más: ${pb.curves.map((c) => `${esc(c.campaign_name.split(' · ')[0])} ${c.points[d]?.cohorts ?? 0}`).join(' · ')}</div>` }, 260);
  const weeks = [...new Set(pb.cohorts.map((c) => c.week_start))].slice(0, 8);
  const rows = pb.cohorts.filter((c) => weeks.includes(c.week_start));
  const rcell = (v) => (v === null ? '<span class="muted">—</span>' : v >= 1 ? `<b class="ok">${pct(v, 0)}</b>` : pct(v, 0));
  const pbCell = (c) => c.payback_day !== null ? `<td class="num pb-ok">✓ día ${c.payback_day}</td>` : c.age_days === 0 ? '<td class="num muted">semana en curso</td>' : c.age_days < 14 ? '<td class="num muted">muy joven</td>' : c.projected_payback_day !== null ? `<td class="num">proyección día ${c.projected_payback_day}</td>` : '<td class="num bad">no al ritmo actual</td>';
  return `<div class="card"><h3>Payback por campaña</h3>
    <p class="muted" style="margin-top:0">Porcentaje de la inversión recuperado con el NGR acumulado, por días desde el registro. Cada punto usa solo cohortes con esa antigüedad.</p>

    <h3 style="margin-top:14px">Cohortes semanales (últimas ${weeks.length} semanas)</h3>
    <div class="scroll"><table><tr><th>Semana</th><th>Campaña</th><th class="num">Antigüedad</th><th class="num">Registros</th><th class="num">FTD</th><th class="num">Inversión</th><th class="num">D7</th><th class="num">D14</th><th class="num">D30</th><th class="num">D60</th><th class="num">Hoy</th><th class="num">Payback</th></tr>
    ${rows.map((c) => `<tr><td>${new Date(c.week_start + 'T12:00:00Z').toLocaleDateString('es-CO', { day: 'numeric', month: 'short' })}</td><td><span class="sw" style="background:${campaignColor(c.campaign_id)}"></span>${esc(c.campaign_name)}</td><td class="num">${c.age_days} d</td><td class="num">${c.registrations}</td><td class="num">${c.ftd}</td><td class="num">${moneyC(c.spend_minor)}</td><td class="num">${rcell(c.recovered_at.d7)}</td><td class="num">${rcell(c.recovered_at.d14)}</td><td class="num">${rcell(c.recovered_at.d30)}</td><td class="num">${rcell(c.recovered_at.d60)}</td><td class="num">${rcell(c.recovered_to_date)}</td>${pbCell(c)}</tr>`).join('')}
    </table></div>
    <details><summary>Cómo se calcula</summary><dl class="defs">${Object.entries(pb.definitions).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl></details></div><br>`;

function perfSection(p) {
  const t = p.totals;
  const tile = (lbl, val, sub = '') => `<div class="kpi-card"><div class="lbl">${lbl}</div><div class="val">${val}</div><div class="sub">${sub}</div></div>`;
  const f = p.funnel;
  const steps = [['Impresiones', f.impressions, null], ['Clics', f.clicks, f.impressions], ['Registros', f.registrations, f.clicks], ['FTD', f.ftd, f.registrations], ['Retenidos D30', f.retained_d30, t.retention_d30.eligible || null]];
  const rows = [...p.campaigns, { ...t, campaign_name: 'Total' }];
  return `
  <section aria-labelledby="perf-h">
    <div class="perf-head"><h2 id="perf-h">Adquisición y valor</h2>
      <label>Período <select id="perfDays">${[30, 60, 90].map((d) => `<option value="${d}" ${d === perfDays ? 'selected' : ''}>Últimos ${d} días</option>`).join('')}</select></label>
      <span class="muted">Cohortes registradas en el período · valor hasta hoy · ${esc(p.currency)}</span></div>
    <div class="kpis">
      ${tile('Inversión', moneyC(t.spend_minor), `${int(t.impressions)} impresiones`)}
      ${tile('CTR', pct(t.ctr, 2), `${int(t.clicks)} clics`)}
      ${tile('FTD %', pct(t.ftd_rate), `${int(t.ftd)} FTD de ${int(t.registrations)} registros`)}
      ${tile('CPA', moneyC(t.cpa_minor), 'por registro')}
      ${tile('Costo por FTD', moneyC(t.cost_per_ftd_minor), 'inversión / FTD')}
      ${tile('Depósitos', moneyC(t.deposits_minor), 'netos de reversos')}
      ${tile('GGR', moneyC(t.ggr_minor), 'apuestas − premios')}
      ${tile('NGR', moneyC(t.ngr_minor), `bonos ${moneyC(t.bonus_cost_minor)} · impuesto ${moneyC(t.gaming_tax_minor)}`)}
      ${tile('Retención D7', t.retention_d7.eligible ? pct(t.retention_d7.rate) : 'inmadura', `${t.retention_d7.retained}/${t.retention_d7.eligible} FTD`)}
      ${tile('Retención D30', t.retention_d30.eligible ? pct(t.retention_d30.rate) : 'inmadura', `${t.retention_d30.retained}/${t.retention_d30.eligible} FTD`)}
      ${tile('ROI', roiCell(t.roi), `valor por FTD ${moneyC(t.ngr_per_ftd_minor)}`)}
    </div><br>
    ${trendSection(p)}
    ${p.__payback ? paybackSection(p.__payback) : ''}
    <div class="grid">
      <div class="card"><h3>Embudo</h3>
        ${steps.map(([l, v, prev], i) => {
          const immature = i === steps.length - 1 && !prev;
          const share = i === 0 ? 1 : prev ? v / prev : 0;
          return `<div class="funnel-row"><span>${l}</span><div class="bar" role="img" aria-label="${l}: ${immature ? 'cohorte inmadura' : pct(share) + ' del paso anterior'}"><span style="width:${immature ? 0 : Math.max(2, 100 * share)}%"></span></div><span class="num">${immature ? '<span class="muted">inmadura</span>' : `${int(v)} <span class="muted">${i ? pct(share) : ''}</span>`}</span></div>`;
        }).join('')}
        <p class="muted">Cada barra muestra la conversión desde el paso anterior. Retenidos D30 se mide sobre FTD con 30 días o más.</p></div>
      <div class="card scroll" style="grid-column: span 2"><h3>Marketing → CRM → Loyalty</h3>
        <table><tr><th>Campaña</th><th class="num">Alcance CRM</th><th class="num">Plata o más</th><th class="num">Bonos CRM</th><th class="num">Valor por FTD</th></tr>
        ${rows.map((c) => `<tr class="${c.campaign_id === 'total' ? 'total' : ''}"><td>${esc(c.campaign_name)}</td><td class="num">${pct(c.crm_reach, 0)}</td><td class="num">${pct(c.loyalty_silver_plus, 0)}</td><td class="num">${moneyC(c.bonus_cost_minor)}</td><td class="num">${moneyC(c.ngr_per_ftd_minor)}</td></tr>`).join('')}</table></div>
    </div><br>
    <div class="card scroll"><h3>Rendimiento por campaña</h3>
      <table><tr><th>Campaña</th><th class="num">Inversión</th><th class="num">CTR</th><th class="num">Registros</th><th class="num">FTD %</th><th class="num">CPA</th><th class="num">Costo/FTD</th><th class="num">Depósitos</th><th class="num">GGR</th><th class="num">NGR</th><th class="num">D7</th><th class="num">D30</th><th class="num">ROI</th></tr>
      ${rows.map((c) => `<tr class="${c.campaign_id === 'total' ? 'total' : ''}"><td>${esc(c.campaign_name)}${c.channel && c.channel !== 'all' ? `<br><span class="chip">${esc(CHANNEL[c.channel] ?? c.channel)}</span>` : ''}</td><td class="num">${moneyC(c.spend_minor)}</td><td class="num">${pct(c.ctr, 2)}</td><td class="num">${int(c.registrations)}</td><td class="num">${pct(c.ftd_rate)}</td><td class="num">${moneyC(c.cpa_minor)}</td><td class="num">${moneyC(c.cost_per_ftd_minor)}</td><td class="num">${moneyC(c.deposits_minor)}</td><td class="num">${moneyC(c.ggr_minor)}</td><td class="num">${moneyC(c.ngr_minor)}</td><td class="num">${ret(c.retention_d7)}</td><td class="num">${ret(c.retention_d30)}</td><td class="num">${roiCell(c.roi)}</td></tr>`).join('')}
      </table>
      <details><summary>Cómo se calcula</summary>
        <p class="muted">Definición financiera <b>${esc(p.finance_definition.version)}</b> · impuesto sobre GGR ${pct(p.finance_definition.gaming_tax_rate, 0)} (valor de ejemplo, a validar con Finanzas) · días con inversión reportada: ${p.data_quality.spend_days_reported} · registros sin atribución: ${p.data_quality.unattributed_registrations}${p.data_quality.mixed_currency_excluded ? ` · excluidos por moneda: ${p.data_quality.mixed_currency_excluded}` : ''}</p>
        <dl class="defs">${Object.entries(p.definitions).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      </details></div>
  </section><br><h2 style="font-size:18px;margin:8px 0 12px">Operación CRM</h2>`;
}

const money = (minor, cur = 'COP') => (minor / 100).toLocaleString('es-CO', { style: 'currency', currency: cur, maximumFractionDigits: 0 });
let current = 'tower';

async function api(path, opts = {}) {
  const role = $('#role').value;
  const res = await fetch('/api' + path, {
    method: opts.method ?? 'GET',
    headers: { 'content-type': 'application/json', 'x-tenant-id': $('#tenant').value, 'x-roles': role, 'x-actor': role + '@ss1' },
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw Object.assign(new Error(data.message ?? data.error), { data });
  return data;
}

async function loadSession() {
  SESSION = await api('/session');
  if (!TABS.some(([k, , p]) => k === current && can(p))) current = 'tower';
}

function renderTabs() {
  $('#tabs').innerHTML = TABS.filter(([, , p]) => can(p)).map(([k, l]) => `<button role="tab" aria-selected="${k === current}" data-k="${k}">${l}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { current = b.dataset.k; flash(''); renderTabs(); show(); });
}

async function show() {
  const v = $('#view');
  v.innerHTML = '<p class="muted">Cargando…</p>';
  try { v.innerHTML = await VIEWS[current](); BIND[current]?.(); }
  catch (e) { v.innerHTML = `<div class="card bad">Error: ${esc(e.message)}</div>`; }
}

    return `<div class="card scroll"><h3>Tratamiento vs. control</h3><table><tr><th>Campaña</th><th>Métrica</th><th>Tratamiento</th><th>Control</th><th>Conversión observada</th><th>Incremento estimado (IC 95 %)</th><th>Costo</th></tr>
      ${rs.map((r) => `<tr><td>${esc(r.campaign)}</td><td>${esc(r.primary_metric)}</td><td>${r.treatment.conversions}/${r.treatment.n}</td><td>${r.control.conversions}/${r.control.n}</td><td>${(100 * r.observed_conversion).toFixed(1)} %</td>
        <td>${(100 * r.estimated_lift.absolute).toFixed(1)} pp [${(100 * r.estimated_lift.ci95[0]).toFixed(1)}; ${(100 * r.estimated_lift.ci95[1]).toFixed(1)}] ${r.estimated_lift.reliable ? '' : `<br><span class="warn">${esc(r.estimated_lift.note)}</span>`}</td><td>${money(r.cost_minor, r.currency)}</td></tr>`).join('')}
    </table><p class="muted">La conversión observada no es incremento. El incremento se estima contra un grupo de control asignado por jugador de forma estable.</p></div>`;
  },
  async loyalty() {
    const list = await api('/players');
    return `<div class="row"><label>Jugador <select id="lp">${list.map((p) => `<option>${esc(p.player_id)}</option>`).join('')}</select></label></div><div id="lout"></div>`;
  },
  async copilot() {
    const tools = await api('/copilot/tools');
    return `<div class="card"><h3>Herramientas disponibles para tu rol</h3>${tools.map((t) => `<span class="chip">${esc(t.name)}</span>`).join('') || '<span class="muted">Ninguna</span>'}
      <p class="muted">Solo lectura de agregados y borradores. Sin permisos para enviar, publicar, otorgar premios ni cambiar restricciones.</p>
      ${SESSION.copilot_ask ? '<div class="row"><input id="q" style="flex:1; min-width:0" placeholder="Pregunta en lenguaje natural"><button id="ask">Preguntar</button></div>' : '<p class="muted">Las preguntas en lenguaje natural (Claude) se habilitan en el servidor con credenciales de Anthropic. Aquí puedes ejecutar las herramientas directamente.</p>'}
      <h3>Llamada directa a herramienta</h3>
      <div class="row"><select id="tool">${tools.map((t) => `<option>${esc(t.name)}</option>`).join('')}</select></div>
      <textarea id="tin" rows="5">{"metric": "kyc_verified_rate"}</textarea>
      <div class="row" style="margin-top:8px"><button id="call">Ejecutar</button></div><pre id="cout"></pre></div>`;
  },
  async audit() {
    const a = await api('/audit');
    return `<div class="card scroll"><h3>Registro de auditoría <span class="chip ${a.chain_valid ? 'ok' : 'bad'}">cadena ${a.chain_valid ? 'íntegra' : 'alterada'}</span></h3>
      <table><tr><th>#</th><th>Fecha</th><th>Actor</th><th>Acción</th><th>Sujeto</th><th>Detalle</th></tr>${a.entries.slice().reverse().map((e) => `<tr><td>${e.seq}</td><td>${new Date(e.at).toLocaleString('es-CO')}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}</td><td>${esc(e.subject)}</td><td><code>${esc(JSON.stringify(e.details))}</code></td></tr>`).join('')}</table></div>`;
  },
};

const BIND = {
  tower() {
    if ($('#perfDays')) $('#perfDays').onchange = () => { perfDays = Number($('#perfDays').value); show(); };
    drawCharts();
    document.querySelectorAll('[data-ack]').forEach((b) => b.onclick = async () => {
      try { await api(`/kpi-alerts/${encodeURIComponent(b.dataset.ack)}/ack`, { method: 'POST', body: {} }); flash('Alerta marcada como revisada. Queda registrada en la auditoría.', 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    });
    if ($('#cfgForm')) $('#cfgForm').onsubmit = async (ev) => {
      ev.preventDefault();
      const body = {};
      for (const [k, [, mult]] of Object.entries(CFG_LABELS)) body[k] = Number($('#cfg_' + k).value) * mult;
      try { await api('/kpi-alerts/config', { method: 'PUT', body }); flash('Umbrales guardados. Las alertas se recalcularon.', 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    };
    if ($('#tick')) $('#tick').onclick = async () => { try { const r = await api('/runtime/tick', { method: 'POST', body: { advance_hours: 24 } }); flash(`Reloj de la demo adelantado 24 h. Instancias procesadas: ${r.processed}.`, 'ok'); show(); } catch (e) { flash(e.message, 'bad'); } };
    if ($('#gpause')) $('#gpause').onclick = async () => {
      const t = await api('/control-tower');
      try { const r = await api('/runtime/pause', { method: 'POST', body: { paused: !t.global_pause, reason: 'manual desde Control Tower' } }); flash(r.global_pause ? 'Pausa general activa: no se generan nuevos envíos ni otorgamientos.' : 'Envíos reanudados.', r.global_pause ? 'warn' : 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    };
  },
  profile() {
    const open = async (id) => {
      const d = await api('/players/' + encodeURIComponent(id));
      const p = d.profile;
      const f = (label, x) => `<tr><th>${label}</th><td>${esc(x.value)}</td><td class="muted">${esc(x.source)} · ${x.as_of ? new Date(x.as_of).toLocaleString('es-CO') : '—'} · v${x.version}</td></tr>`;
      const ex = d.eligibility_explanation;
      $('#pdetail').innerHTML = `<h3>${esc(p.player_id)} · ${esc(p.brand_id)}</h3>
        <table>${f('Email', p.contact.email)}${f('KYC', p.kyc)}${f('Juego responsable', p.rg)}${f('País', p.country)}${f('Zona horaria', p.timezone)}
        ${Object.entries(p.consents).map(([k, v]) => f('Consentimiento ' + k, v)).join('')}</table>
        <h3 style="margin-top:12px">Por qué recibe o no marketing</h3>
        ${Object.entries(ex.marketing).map(([c, x]) => `<div><b>${c}</b>: <span class="${x.kind === 'allow' ? 'ok' : x.kind === 'defer' ? 'warn' : 'bad'}">${x.kind}</span> <span class="muted">${x.reasons.map(esc).join(', ')} · política ${esc(x.policy_version)}</span></div>`).join('')}
        <div><b>incentivos</b>: <span class="${ex.incentive.kind === 'allow' ? 'ok' : 'bad'}">${ex.incentive.kind}</span> <span class="muted">${ex.incentive.reasons.map(esc).join(', ')}</span></div>
        ${d.loyalty ? `<h3 style="margin-top:12px">Fidelidad</h3>${esc(d.loyalty.level)} · ${d.loyalty.points} pts · ${d.loyalty.percent_to_next}% hacia ${esc(d.loyalty.next_level ?? '—')}` : ''}
        <h3 style="margin-top:12px">Recompensas</h3>${d.grants.map((g) => `<span class="chip">${esc(g.reward_id)} · ${esc(g.status)}</span>`).join('') || '<span class="muted">—</span>'}
        <h3 style="margin-top:12px">Mensajes</h3>${d.receipts.map((r) => `<div>${esc(r.channel)} · ${esc(r.template)} · <span class="${r.status === 'accepted' ? 'ok' : 'bad'}">${esc(r.status)}</span> <span class="muted">${esc(r.reason ?? '')}</span></div>`).join('') || '<span class="muted">—</span>'}
        <h3 style="margin-top:12px">Línea de tiempo</h3><div class="scroll"><table>${p.timeline.map((t) => `<tr><td class="muted">${new Date(t.occurred_at).toLocaleString('es-CO')}</td><td>${esc(t.event_type)}</td><td class="muted">${esc(t.source)}</td></tr>`).join('')}</table></div>`;
    };
    document.querySelectorAll('[data-p]').forEach((a) => a.onclick = (e) => { e.preventDefault(); open(a.dataset.p); });
    $('#pgo').onclick = () => open($('#pq').value.trim());
  },
  segments() {
    $('#prev').onclick = async () => {
      try {
        const excl = $('#excl').value.trim();
        const r = await api('/segments/preview', { method: 'POST', body: { rules: JSON.parse($('#rules').value), exclusions: excl ? JSON.parse(excl) : undefined } });
        $('#segout').innerHTML = `<div class="grid" style="margin-top:10px"><div class="card"><h3>Tamaño</h3><div class="kpi">${r.size}</div></div><div class="card"><h3>Excluidos</h3><div class="kpi">${r.excluded}</div></div><div class="card"><h3>Universo</h3><div class="kpi">${r.universe}</div></div></div><p class="muted">Snapshot ${esc(r.snapshot_hash.slice(0, 12))}. La elegibilidad se revalida al ejecutar.</p>`;
      } catch (e) { $('#segout').innerHTML = `<p class="bad">${esc(e.message)} ${esc(JSON.stringify(e.data?.errors ?? ''))}</p>`; }
    };
  },
  builder() {
    document.querySelectorAll('[data-sim]').forEach((b) => b.onclick = async () => {
      const id = b.dataset.sim;
      const pid = document.querySelector(`[data-simp="${id}"]`).value;
      const r = await api(`/journeys/${id}/simulate`, { method: 'POST', body: { player_id: pid, payload: { level: 'Plata', season: '2026-Q4', percent: 55, grant_id: 'sim', reward_type: 'free_spins', value: { amount_minor: 100000, currency: 'COP' }, expires_at: '2026-12-31T00:00:00Z' } } });
      document.querySelector(`[data-simout="${id}"]`).innerHTML = `<pre class="trace">${esc(r.trace.map((s) => `${s.node.padEnd(14)} ${s.type.padEnd(12)} ${s.outcome}${s.decision ? '  ← ' + s.decision.reasons.join(',') : ''}`).join('\n'))}\n→ ${esc(r.status)} (sin efectos externos)</pre>`;
    });
    const act = (attr, action) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.onclick = async () => {
      try { await api(`/journeys/${b.dataset[attr]}/${action}`, { method: 'POST', body: { reason: 'manual' } }); flash(action === 'pause' ? 'Recorrido en pausa: las instancias quedan esperando.' : 'Recorrido reanudado.', 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    act('pause', 'pause'); act('resume', 'resume');
    if (!$('#savedraft')) return;
    $('#savedraft').onclick = async () => {
      try { const d = await api('/journeys', { method: 'POST', body: JSON.parse($('#draft').value) }); $('#draftout').innerHTML = `<p class="ok">Borrador ${esc(d.id)} v${d.version} guardado.</p>`; }
      catch (e) { $('#draftout').innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
    };
    $('#submit').onclick = async () => {
      try { const d = await api(`/journeys/${JSON.parse($('#draft').value).id}/submit`, { method: 'POST' }); $('#draftout').innerHTML = `<p class="ok">v${d.version} enviado a aprobación. Cambia al rol «Aprobador».</p>`; }
      catch (e) { $('#draftout').innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
    };
  },
  approval() {
    const act = (attr, action) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.onclick = async () => {
      try { await api(`/journeys/${b.dataset[attr]}/${action}`, { method: 'POST' }); flash(action === 'approve' ? 'Aprobado y firmado. Ya se puede publicar.' : 'Publicado. Las nuevas instancias usan esta versión.', 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    act('approve', 'approve'); act('publish', 'publish');
  },
  loyalty() {
    const load = async () => {
      const d = await api('/players/' + encodeURIComponent($('#lp').value));
      const l = d.loyalty;
      $('#lout').innerHTML = `<div class="phone">
        <div class="muted">RumbaWin · Temporada ${esc(l.season)}</div>
        <h2 style="margin:6px 0">Nivel ${esc(l.level)}</h2>
        <div class="bar" role="progressbar" aria-valuenow="${l.percent_to_next}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso al siguiente nivel"><span style="width:${l.percent_to_next}%"></span></div>
        <p>${l.next_level ? `${l.percent_to_next} % hacia <b>${esc(l.next_level)}</b> · faltan ${l.points_to_next} pts` : 'Nivel máximo'}</p>
        <h3>Recompensas</h3>${d.profile.rewards.map((r) => `<div class="card" style="margin-bottom:6px">${esc(r.reward_type)} · ${money(r.amount_minor, r.currency)}<br><span class="muted">Vence ${new Date(r.expires_at).toLocaleDateString('es-CO')}</span></div>`).join('') || '<p class="muted">Sin recompensas activas</p>'}
        <h3>Movimientos</h3>${l.movements.slice(-6).reverse().map((m) => `<div>${m.points > 0 ? '+' : ''}${m.points} pts <span class="muted">${esc(m.reason)}</span></div>`).join('') || '<p class="muted">—</p>'}
        <h3>Preferencias</h3><label><input type="checkbox" checked disabled> Recibir avisos de progreso</label></div>`;
    };
    $('#lp').onchange = load; load();
  },
  copilot() {
    const samples = { query_metric: { metric: 'kyc_verified_rate' }, preview_segment: { rules: { field: 'kyc', op: 'eq', value: 'verified' }, exclusions: { field: 'rg', op: 'neq', value: 'none' } }, validate_policy: { journey: { id: 'j_demo', purpose: 'marketing', trigger: { event_type: 'deposit.settled' }, entry: 'm', nodes: [{ id: 'm', type: 'message', channel: 'inapp', template: 'loyalty_halfway', next: 'e' }, { id: 'e', type: 'exit' }] } } };
    samples.simulate_journey = { ...samples.validate_policy, synthetic_profile: { rg: 'self_excluded' } };
    samples.save_draft = samples.validate_policy;
    const fill = () => { $('#tin').value = JSON.stringify(samples[$('#tool').value] ?? {}, null, 2); };
    if ($('#tool')) { $('#tool').onchange = fill; fill(); }
    $('#call').onclick = async () => { try { $('#cout').textContent = JSON.stringify(await api('/copilot/tools/' + $('#tool').value, { method: 'POST', body: JSON.parse($('#tin').value) }), null, 2); } catch (e) { $('#cout').textContent = e.message; } };
    if ($('#ask')) $('#ask').onclick = async () => { $('#cout').textContent = 'Consultando…'; try { $('#cout').textContent = JSON.stringify(await api('/copilot/ask', { method: 'POST', body: { question: $('#q').value } }), null, 2); } catch (e) { $('#cout').textContent = e.message; } };
  },
};

async function boot() {
  flash('');
  try { await loadSession(); } catch (e) { flash(e.message, 'bad'); }
  renderTabs(); show();
}
if (window.SS1_STATIC) $('#mode').hidden = false;
$('#tenant').onchange = boot; $('#role').onchange = boot;
boot();
</script>
</body>
</html>
