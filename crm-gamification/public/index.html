<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>SS1 CRM y Fidelidad</title>
<link rel="icon" type="image/webp" href="brand/ss1-icon.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
<style>
  /* Diseño SS1 Admin (Vuexy/Vuetify, tema oscuro): menú lateral + barra superior flotante + tarjetas sobre fondo negro, acento dorado. */
  :root {
    color-scheme: dark;
    --bg: #050505; --panel: #111111; --panel-2: #181818; --ink: #e7e3d8; --muted: #9b968a; --line: #2a2a2a;
    --brand: #d5a021; --brand-ink: #000000; --brand-soft: rgba(213, 160, 33, .16); --brand-grad: linear-gradient(72.47deg, #d5a021 22.16%, rgba(213, 160, 33, .72) 76.47%);
    --ok: #28c76f; --bad: #ea5455; --warn: #ff9f43; --info: #00cfe8; --chip: #1d1d1d;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --series-other: #7d838c;
    --status-warning: #fab219; --status-serious: #ff9f43; --status-critical: #ea5455; --grid: #222222;
    --shadow: 0 3px 9px 1px rgba(0, 0, 0, .2), 0 9px 8px 0 rgba(0, 0, 0, .06), 0 1px 6px 4px rgba(0, 0, 0, .1);
    --shadow-sm: 0 2px 4px rgba(0, 0, 0, .3);
    --radius: 6px; --sidebar: 260px;
    --font: Roboto, "Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--bg); }
  body { margin: 0; font: 15px/1.5 var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
  select, input, textarea, button { font: inherit; color: inherit; }
  select, input, textarea { background: transparent; border: 1px solid rgba(255, 255, 255, .22); border-radius: var(--radius); padding: 7px 12px; color: var(--ink); }
  select { background: var(--panel); }
  select:hover, input:hover, textarea:hover { border-color: rgba(255, 255, 255, .4); }
  textarea { width: 100%; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  button { background: var(--brand); color: var(--brand-ink); border: 0; border-radius: var(--radius); padding: 8px 18px; cursor: pointer; font-weight: 500; font-size: 13.5px; letter-spacing: .06em; text-transform: uppercase; box-shadow: var(--shadow-sm); transition: background .15s, box-shadow .15s; }
  button:hover { filter: brightness(1.08); box-shadow: 0 4px 12px var(--brand-soft); }
  button.ghost { background: transparent; color: var(--brand); border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent); box-shadow: none; }
  button.ghost:hover { background: var(--brand-soft); }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
  select:focus, input:focus, textarea:focus { border-color: var(--brand); outline: none; box-shadow: 0 0 0 1px var(--brand); }
  button:disabled { opacity: .45; cursor: not-allowed; box-shadow: none; }
  a { color: var(--brand); }

  /* Layout: menú lateral fijo + contenido */
  .layout { display: grid; grid-template-columns: var(--sidebar) minmax(0, 1fr); min-height: 100vh; }
  .sidebar { position: sticky; top: 0; height: 100vh; background: var(--panel); box-shadow: var(--shadow); display: flex; flex-direction: column; z-index: 20; }
  .brandbar { display: flex; align-items: center; justify-content: center; padding: 18px 16px 10px; }
  .brandbar img { width: 170px; height: auto; display: block; }
  .sidebar .section { padding: 14px 22px 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  nav#tabs { display: flex; flex-direction: column; gap: 4px; padding: 4px 14px 16px; overflow-y: auto; }
  nav#tabs button { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: transparent; color: var(--ink); opacity: .86; text-transform: none; letter-spacing: 0; font-size: 15px; font-weight: 400; padding: 9px 14px; box-shadow: none; border-radius: var(--radius); }
  nav#tabs button:hover { background: rgba(255, 255, 255, .06); opacity: 1; }
  nav#tabs button svg { width: 22px; height: 22px; flex: none; stroke: currentColor; }
  nav#tabs button[aria-selected="true"] { background: var(--brand-grad); color: var(--brand-ink); opacity: 1; font-weight: 500; box-shadow: 0 2px 6px color-mix(in srgb, var(--brand) 35%, transparent); }
  .sidebar .foot { margin-top: auto; padding: 14px 22px 18px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .shell { min-width: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  header.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; margin-top: 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 14px; background: rgba(17, 17, 17, .88); backdrop-filter: blur(9px); border-radius: var(--radius); box-shadow: var(--shadow); }
  header.topbar h1 { font-size: 17px; font-weight: 500; margin: 0; }
  header.topbar .ctx { margin-left: auto; display: flex; gap: 10px; align-items: center; color: var(--muted); flex-wrap: wrap; font-size: 13px; }
  header.topbar label { display: flex; gap: 6px; align-items: center; }
  .menu-btn { display: none; background: transparent; color: var(--ink); padding: 6px; box-shadow: none; }
  .menu-btn svg { width: 24px; height: 24px; stroke: currentColor; display: block; }
  main { padding-block: 22px 40px; max-width: 1400px; margin: 0 auto; }
  .scrim { display: none; }
  @media (max-width: 1100px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .sidebar { position: fixed; left: 0; top: 0; bottom: 0; height: auto; width: var(--sidebar); transform: translateX(-105%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
    body.nav-open .sidebar { transform: none; }
    body.nav-open .scrim { display: block; position: fixed; inset: 0; background: rgba(0, 0, 0, .55); z-index: 19; }
    .menu-btn { display: inline-flex; }
    .shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  /* Modo embebido en admin.syssoft1.com: el admin pone menú lateral y barra; aquí quedan pestañas horizontales */
  body.embedded .layout { display: block; min-height: 0; }
  body.embedded .sidebar { position: static; height: auto; width: auto; transform: none; box-shadow: none; background: transparent; padding: 0 max(16px, env(safe-area-inset-left, 0px)); }
  body.embedded .brandbar, body.embedded .sidebar .section, body.embedded .sidebar .foot, body.embedded .menu-btn, body.embedded header.topbar .ctx, body.embedded #pageTitle { display: none; }
  body.embedded nav#tabs { flex-direction: row; overflow-x: auto; padding: 12px 0 0; gap: 6px; }
  body.embedded nav#tabs button { width: auto; white-space: nowrap; padding: 8px 14px; }
  body.embedded .shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body.embedded header.topbar { position: static; margin-top: 12px; box-shadow: none; background: transparent; padding: 0; }
  body.embedded main { padding-top: 14px; }
  .profile-grid { grid-template-columns: minmax(240px, 1fr) 2fr; }
  @media (max-width: 760px) { .profile-grid { grid-template-columns: minmax(0, 1fr); } }
  .waiting { padding: 40px 0; text-align: center; color: var(--muted); }

  /* Componentes */
  .flash { padding: 11px 14px; border-radius: var(--radius); background: var(--brand-soft); border-left: 3px solid var(--brand); margin-bottom: 14px; color: var(--ink); }
  .flash.ok { background: rgba(40, 199, 111, .14); border-left-color: var(--ok); } .flash.bad { background: rgba(234, 84, 85, .14); border-left-color: var(--bad); } .flash.warn { background: rgba(255, 159, 67, .14); border-left-color: var(--warn); }
  .trace { white-space: pre-wrap; word-break: break-word; }
  .grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
  .card { background: var(--panel); border-radius: var(--radius); padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); color: rgba(231, 227, 216, .92); }
  .card h3 { margin: 0 0 12px; font-size: 17px; color: var(--ink); font-weight: 500; letter-spacing: 0; text-transform: none; }
  .kpi { font-size: 26px; font-weight: 500; color: var(--ink); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--ink); font-weight: 500; font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; background: var(--panel-2); white-space: nowrap; }
  tr:hover td { background: rgba(255, 255, 255, .025); }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 99px; background: var(--chip); color: var(--ink); font-size: 12.5px; margin: 1px 2px 1px 0; }
  .chip.brand { background: var(--brand-soft); color: var(--brand); font-weight: 500; }
  .ok { color: var(--ok); } .bad { color: var(--bad); } .warn { color: var(--warn); } .muted { color: var(--muted); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  pre { background: #0a0a0a; border: 1px solid var(--line); padding: 12px; border-radius: var(--radius); overflow: auto; font-size: 12.5px; max-height: 420px; color: var(--ink); }
  .bar { height: 10px; background: var(--chip); border-radius: 99px; overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--brand); border-radius: 99px; }
  .phone { max-width: 360px; margin: 0 auto; border: 1px solid var(--line); border-radius: 28px; padding: 20px; background: var(--panel); box-shadow: var(--shadow); }
  .scroll { overflow-x: auto; }
  .perf-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 4px 0 16px; }
  .perf-head h2 { font-size: 21px; font-weight: 500; margin: 0; text-wrap: balance; color: var(--ink); }
  .kpis { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); }
  .kpi-card { background: var(--panel); border-radius: var(--radius); padding: 16px 18px; min-width: 0; box-shadow: var(--shadow); border-top: 2px solid transparent; }
  .kpi-card:hover { border-top-color: var(--brand); }
  .kpi-card .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; font-weight: 500; }
  .kpi-card .val { font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; margin-top: 4px; color: var(--ink); }
  .kpi-card .sub { font-size: 12.5px; color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  tr.total td { font-weight: 500; color: var(--ink); border-top: 2px solid var(--brand); background: var(--brand-soft); }
  .funnel-row { display: grid; grid-template-columns: 130px 1fr 120px; gap: 12px; align-items: center; margin: 8px 0; }
  .funnel-row .bar { height: 12px; }
  details summary { cursor: pointer; color: var(--brand); margin-top: 6px; }
  .chart { position: relative; min-width: 0; }
  .chart svg { display: block; width: 100%; overflow: visible; }
  .chart:focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: 6px; }
  .chart .axis { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .chart .lbl-end { fill: var(--ink); font-size: 12px; font-weight: 600; }
  .chart .tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); min-width: 150px; z-index: 2; }
  .chart .tip b { display: block; margin-bottom: 4px; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); margin: 2px 0 6px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
  .sw.line { height: 3px; border-radius: 2px; vertical-align: 3px; width: 14px; }
  .alerts { display: grid; gap: 8px; }
  .alert { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-left: 3px solid var(--muted); border-radius: var(--radius); background: var(--panel-2); }
  .alert.sev-critical { border-left-color: var(--status-critical); } .alert.sev-serious { border-left-color: var(--status-serious); } .alert.sev-warning { border-left-color: var(--status-warning); }
  .alert.acked { opacity: .65; }
  .sev { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 650; white-space: nowrap; padding-top: 1px; }
  .sev i { width: 10px; height: 10px; display: inline-block; }
  .sev.critical i { background: var(--status-critical); transform: rotate(45deg); }
  .sev.serious i { background: var(--status-serious); border-radius: 2px; }
  .sev.warning i { background: var(--status-warning); border-radius: 50%; }
  .alert .t { font-weight: 600; } .alert .d { color: var(--muted); font-size: 13px; } .alert .a { font-size: 13px; }
  .cfg { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px 14px; margin-top: 10px; }
  .cfg label { display: grid; gap: 2px; font-size: 12px; color: var(--muted); } .cfg input { width: 100%; }
  td.pb-ok { color: var(--ok); font-weight: 600; }
  @media (max-width: 620px) { .alert { grid-template-columns: 1fr; } }
  dl.defs { display: grid; grid-template-columns: minmax(110px, max-content) 1fr; gap: 4px 12px; margin: 10px 0 0; }
  dl.defs dt { font-weight: 600; } dl.defs dd { margin: 0; color: var(--muted); }
  @media (max-width: 620px) { .funnel-row { grid-template-columns: 90px 1fr 80px; } .grid > [style*="span 2"] { grid-column: auto !important; } }
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar" aria-label="Navegación principal">
    <div class="brandbar"><img src="brand/ss1-logo.webp" alt="SS1 SyssoftOne" width="170" height="80"></div>
    <div class="section">CRM y gamificación</div>
    <nav role="tablist" id="tabs" aria-orientation="vertical"></nav>
    <div class="foot">Datos sintéticos de demostración. No son cifras reales.</div>
  </aside>
  <div class="scrim" id="scrim"></div>
  <div class="shell">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menú"><svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <h1 id="pageTitle">Control Tower</h1>
      <span class="chip brand">Datos sintéticos</span><span class="chip" id="mode" hidden>Demo en navegador</span>
      <div class="ctx">
        <label>Tenant <select id="tenant"><option>tenant-rumbawin</option><option>tenant-demo-b</option></select></label>
        <label>Rol <select id="role">
          <option value="crm_analyst">Analista CRM</option>
          <option value="approver">Aprobador</option>
          <option value="support">Soporte</option>
          <option value="rg_officer">Juego responsable</option>
          <option value="tenant_admin">Admin de tenant</option>
          <option value="auditor">Auditor</option>
        </select></label>
      </div>
    </header>
    <main><div id="flash" class="flash" role="status" hidden></div><div id="view" aria-live="polite"></div></main>
  </div>
</div>

<script>
// pestaña → permiso requerido (null = visible para todos)
const TABS = [
  ['tower', 'Control Tower', null], ['profile', 'Perfil 360', 'players.read'], ['segments', 'Segmentos', 'segments.preview'], ['builder', 'Constructor', null],
  ['approval', 'Aprobación', null], ['analytics', 'Analítica', 'analytics.read'], ['gamification', 'Gamificación', 'gamification.read'], ['loyalty', 'Fidelidad (móvil)', 'players.read'], ['copilot', 'Copiloto', 'copilot'], ['audit', 'Auditoría', 'audit.read'],
];
let SESSION = { permissions: [], copilot_tools: [], copilot_ask: false };
const can = (p) => p === null || (p === 'copilot' ? SESSION.copilot_tools.length > 0 : SESSION.permissions.includes(p));
function flash(msg, kind = '') {
  const f = $('#flash');
  if (!msg) { f.hidden = true; return; }
  f.className = 'flash ' + kind; f.textContent = msg; f.hidden = false;
}
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const moneyC = (minor, cur = 'COP') => minor === null || minor === undefined ? '—' : (minor / 100).toLocaleString('es-CO', { style: 'currency', currency: cur, notation: 'compact', maximumFractionDigits: 1 });
const pct = (x, d = 1) => x === null || x === undefined ? '—' : (x * 100).toLocaleString('es-CO', { maximumFractionDigits: d, minimumFractionDigits: d }) + ' %';
const int = (n) => (n ?? 0).toLocaleString('es-CO');
let perfDays = 60;
const CHANNEL = { google: 'Google', meta: 'Meta', affiliate: 'Afiliados', tiktok: 'TikTok', organic: 'Orgánico', all: '' };
const ret = (r) => r.eligible === 0 ? '<span class="muted" title="Ningún FTD tiene aún la antigüedad necesaria">inmadura</span>' : `${pct(r.rate)} <span class="muted">(${r.retained}/${r.eligible})</span>`;
const roiCell = (x) => x === null ? '—' : `<span class="${x >= 0 ? 'ok' : 'bad'}">${x >= 0 ? '+' : ''}${pct(x, 0)}</span>`;

// ---------- Gráficas (SVG propio, sin librerías) ----------
const CHARTS = {};
const CAMPAIGN_SLOT = { meta_prospecting: 1, google_search_brand: 2, afiliados_cpa: 3, tiktok_awareness: 4 };
const campaignColor = (id) => CAMPAIGN_SLOT[id] ? `var(--series-${CAMPAIGN_SLOT[id]})` : 'var(--series-other)';
function niceTicks(min, max, count = 5) {
  if (min === max) { max = min + 1; }
  const span = max - min, step0 = span / count, mag = Math.pow(10, Math.floor(Math.log10(step0)));
  const step = [1, 2, 2.5, 5, 10].map((m) => m * mag).find((st) => span / st <= count) ?? 10 * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, out = [];
  for (let v = lo; v <= hi + step / 2; v += step) out.push(+v.toFixed(10));
  return out;
}
function chartPlaceholder(id, spec, height = 220) {
  CHARTS[id] = { ...spec, height };
  const legend = spec.series.length > 1 ? `<div class="legend" aria-hidden="true">${spec.series.map((se) => `<span><span class="sw line" style="background:${se.color}"></span>${esc(se.label)}</span>`).join('')}${spec.refY !== undefined ? `<span><span class="sw line" style="background:var(--muted)"></span>${esc(spec.refLabel)}</span>` : ''}</div>` : '';
  const table = `<details><summary>Ver datos en tabla</summary><div class="scroll"><table><tr><th>${esc(spec.xTitle)}</th>${spec.series.map((se) => `<th class="num">${esc(se.label)}</th>`).join('')}</tr>${spec.x.map((x, i) => `<tr><td>${esc(spec.xFmt(x))}</td>${spec.series.map((se) => `<td class="num">${se.values[i] === null || se.values[i] === undefined ? '—' : esc(spec.yFmt(se.values[i]))}</td>`).join('')}</tr>`).join('')}</table></div></details>`;
  return `${legend}<div class="chart" id="${id}" tabindex="0" role="img" aria-label="${esc(spec.aria)}"></div>${table}`;
}
function drawCharts() { for (const id of Object.keys(CHARTS)) { const el = document.getElementById(id); if (el) drawLineChart(el, CHARTS[id]); else delete CHARTS[id]; } }
function drawLineChart(el, spec) {
  const W = Math.max(280, el.clientWidth), H = spec.height, narrow = W < 520;
  const m = { l: 58, r: narrow ? 12 : 128, t: 10, b: 26 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b, n = spec.x.length;
  const vals = spec.series.flatMap((se) => se.values.filter((v) => v !== null && v !== undefined));
  if (spec.refY !== undefined) vals.push(spec.refY);
  let lo = Math.min(0, ...vals), hi = Math.max(...vals, lo + 1e-9);
  const ticks = niceTicks(lo, hi, narrow ? 4 : 5); lo = ticks[0]; hi = ticks.at(-1);
  const X = (i) => m.l + (n <= 1 ? iw / 2 : (i * iw) / (n - 1));
  const Y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;
  const every = Math.max(1, Math.ceil(n / (narrow ? 4 : 8)));
  let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" aria-hidden="true">`;
  for (const tk of ticks) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(tk)}" y2="${Y(tk)}" stroke="var(--grid)" stroke-width="1"/><text class="axis" x="${m.l - 8}" y="${Y(tk) + 4}" text-anchor="end">${esc(spec.yTick(tk))}</text>`;
  if (lo < 0) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--muted)" stroke-width="1"/>`;
  for (let i = 0; i < n; i += every) svg += `<text class="axis" x="${X(i)}" y="${H - 6}" text-anchor="middle">${esc(spec.xTick(spec.x[i]))}</text>`;
  if (spec.refY !== undefined) svg += `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(spec.refY)}" y2="${Y(spec.refY)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="axis" x="${m.l + 6}" y="${Y(spec.refY) - 6}">${esc(spec.refLabel)}</text>`;
  const ends = [];
  for (const se of spec.series) {
    let d = '', pen = false;
    se.values.forEach((v, i) => { if (v === null || v === undefined) { pen = false; return; } d += `${pen ? 'L' : 'M'}${X(i).toFixed(1)},${Y(v).toFixed(1)}`; pen = true; });
    svg += `<path d="${d}" fill="none" stroke="${se.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const li = se.values.map((v, i) => (v === null || v === undefined ? -1 : i)).filter((i) => i >= 0).at(-1);
    if (li !== undefined) ends.push({ y: Y(se.values[li]), x: X(li), se, v: se.values[li] });
  }
  if (!narrow && spec.series.length <= 4) {
    ends.sort((a, b) => a.y - b.y);
    for (let k = 1; k < ends.length; k++) if (ends[k].y - ends[k - 1].y < 15) ends[k].y = ends[k - 1].y + 15;

  }
  svg += `<g class="hover" visibility="hidden"><line class="xh" y1="${m.t}" y2="${m.t + ih}" stroke="var(--muted)" stroke-width="1"/>${spec.series.map((se, k) => `<circle class="pt" data-k="${k}" r="5" fill="${se.color}" stroke="var(--panel)" stroke-width="2"/>`).join('')}</g>`;
  svg += `<rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent"/></svg><div class="tip" hidden></div>`;

    cur = Math.max(0, Math.min(n - 1, i));
    g.setAttribute('visibility', 'visible');
    g.querySelector('.xh').setAttribute('x1', X(cur)); g.querySelector('.xh').setAttribute('x2', X(cur));
    g.querySelectorAll('.pt').forEach((c) => { const v = spec.series[c.dataset.k].values[cur]; if (v === null || v === undefined) c.setAttribute('visibility', 'hidden'); else { c.setAttribute('visibility', 'visible'); c.setAttribute('cx', X(cur)); c.setAttribute('cy', Y(v)); } });
    tip.innerHTML = `<b>${esc(spec.xFmt(spec.x[cur]))}</b>${spec.series.map((se) => `<div><span class="sw line" style="background:${se.color}"></span>${esc(se.label)}: <b style="display:inline">${se.values[cur] === null || se.values[cur] === undefined ? '—' : esc(spec.yFmt(se.values[cur]))}</b></div>`).join('')}${spec.tipExtra ? spec.tipExtra(cur) : ''}`;
    tip.hidden = false;
    const tx = X(cur) + 14 + tip.offsetWidth > W ? X(cur) - tip.offsetWidth - 14 : X(cur) + 14;
    tip.style.left = `${Math.max(0, tx)}px`; tip.style.top = `${m.t}px`;
  };
  const hide = () => { g.setAttribute('visibility', 'hidden'); tip.hidden = true; };
  const idxAt = (clientX) => Math.round(((clientX - el.getBoundingClientRect().left - m.l) / iw) * (n - 1));
  el.onmousemove = (ev) => show(idxAt(ev.clientX));
  el.onmouseleave = hide;
  el.ontouchstart = el.ontouchmove = (ev) => show(idxAt(ev.touches[0].clientX));

  el.onblur = hide;
}

// ---------- Integración con admin.syssoft1.com (modo embebido, protocolo v1) ----------
const CRM_CONFIG = window.SS1_CRM_CONFIG ?? {};
const ALLOWED_ORIGINS = CRM_CONFIG.allowedOrigins ?? ['https://admin.syssoft1.com'];
const EMBED = { active: window.parent !== window, session: null, origin: null, roles: null, pendingTab: null, ready: false };
function toParent(msg) { if (EMBED.active && EMBED.origin) window.parent.postMessage({ ...msg, version: 1 }, EMBED.origin); }
function validSession(m) {
  return !!m && m.type === 'ss1-crm:session' && m.version === 1 && typeof m.accessToken === 'string' && m.accessToken.length > 10
    && typeof m.tenantId === 'string' && /^[\w.-]{1,64}$/.test(m.tenantId) && m.user && typeof m.user.id === 'string' && Array.isArray(m.abilities);
}
if (EMBED.active) {
  document.body.classList.add('embedded');
  window.addEventListener('message', (e) => {
    if (e.source !== window.parent || !ALLOWED_ORIGINS.includes(e.origin)) return; // solo el admin
    const m = e.data;
    if (m?.type === 'ss1-crm:session') {
      if (!validSession(m)) return;
      EMBED.session = m; EMBED.origin = e.origin;
      // En la demo estática el mapeo CASL → roles corre aquí; con servidor, el servidor lo decide (A2)
      EMBED.roles = window.SS1_INTEGRATION ? window.SS1_INTEGRATION.abilitiesToRoles(m.abilities) : null;
      loadTheme(m.theme);
      boot();
    } else if (m?.type === 'ss1-crm:navigate' && EMBED.session && typeof m.tab === 'string') {
      // si los permisos de la sesión aún se están cargando, la pestaña queda pendiente
      if (!EMBED.ready) { EMBED.pendingTab = m.tab; return; }
      if (TABS.some(([k, , p]) => k === m.tab && can(p))) { current = m.tab; renderTabs(); show(); }
    }
  });
  for (const o of ALLOWED_ORIGINS) { try { window.parent.postMessage({ type: 'ss1-crm:ready', version: 1 }, o); } catch { /* origen distinto: el navegador lo descarta */ } }
  if ('ResizeObserver' in window) new ResizeObserver(() => toParent({ type: 'ss1-crm:resize', height: Math.ceil(document.documentElement.scrollHeight) })).observe(document.body);
}

// Tema del operador: primero el servidor (lee /admin/theme-config); si no hay integración, el que envía el admin
function applyTheme(t) {
  if (!t || !t.brand) return;
  const r = document.documentElement.style;
  r.setProperty('--brand', t.brand); r.setProperty('--brand-ink', t.brandInk); r.setProperty('--brand-soft', t.brandSoft); r.setProperty('--brand-grad', t.brandGrad);
  if (t.logo) { const img = document.querySelector('.brandbar img'); if (img) img.src = t.logo; }
  if (t.note) console.warn(t.note);
}
async function loadTheme(fromSession) {
  try { applyTheme(await api('/integration/ss1/theme')); return; } catch { /* 409 sin integración */ }
  if (fromSession && window.SS1_INTEGRATION) applyTheme({ ...window.SS1_INTEGRATION.deriveBrandTokens(fromSession.primary), logo: window.SS1_INTEGRATION.parseThemeConfig({ logo: fromSession.logo }).logo ?? null });
}

async function api(path, opts = {}) {
  const role = $('#role').value;
  const s = EMBED.session;
  const headers = s
    ? { 'content-type': 'application/json', authorization: `Bearer ${s.accessToken}`, 'x-tenant-id': s.tenantId, 'x-actor': `ss1:${s.user.id}`, ...(EMBED.roles ? { 'x-roles': EMBED.roles.join(',') || 'none' } : {}) }
    : { 'content-type': 'application/json', 'x-tenant-id': $('#tenant').value, 'x-roles': role, 'x-actor': role + '@ss1' };
  const res = await fetch('/api' + path, {
    method: opts.method ?? 'GET',
    headers,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  const data = await res.json();
  if (!res.ok) throw Object.assign(new Error(data.message ?? data.error), { data });
  return data;
}

async function loadSession() {
  SESSION = await api('/session');
  if (EMBED.session) {
    EMBED.ready = true;
    if (EMBED.pendingTab && TABS.some(([k, , p]) => k === EMBED.pendingTab && can(p))) current = EMBED.pendingTab;
    EMBED.pendingTab = null;
  }
  if (!TABS.some(([k, , p]) => k === current && can(p))) current = 'tower';
}

function renderTabs() {
  $('#tabs').innerHTML = TABS.filter(([, , p]) => can(p)).map(([k, l]) => `<button role="tab" aria-selected="${k === current}" data-k="${k}">${icon(k)}<span>${l}</span></button>`).join('');
  $('#tabs').querySelectorAll('button').forEach((b) => b.onclick = () => { current = b.dataset.k; flash(''); document.body.classList.remove('nav-open'); renderTabs(); show(); window.scrollTo(0, 0); });
  const t = TABS.find(([k]) => k === current);
  if (t) { $('#pageTitle').textContent = t[1]; document.title = `${t[1]} · SS1 CRM y Fidelidad`; toParent({ type: 'ss1-crm:title', title: t[1], tab: current }); }
}

async function show() {
  const v = $('#view');

}

    const a = await api('/audit');
    return `<div class="card scroll"><h3>Registro de auditoría <span class="chip ${a.chain_valid ? 'ok' : 'bad'}">cadena ${a.chain_valid ? 'íntegra' : 'alterada'}</span></h3>
      <table><tr><th>#</th><th>Fecha</th><th>Actor</th><th>Acción</th><th>Sujeto</th><th>Detalle</th></tr>${a.entries.slice().reverse().map((e) => `<tr><td>${e.seq}</td><td>${new Date(e.at).toLocaleString('es-CO')}</td><td>${esc(e.actor)}</td><td>${esc(e.action)}</td><td>${esc(e.subject)}</td><td><code>${esc(JSON.stringify(e.details))}</code></td></tr>`).join('')}</table></div>`;
  },
};

function openSegmentWith(rule) {
  current = 'segments'; renderTabs(); show().then(() => { $('#rules').value = JSON.stringify(rule, null, 2); $('#excl').value = ''; $('#prev').click(); });
}
const BIND = {
  tower() {
    if ($('#perfDays')) $('#perfDays').onchange = () => { perfDays = Number($('#perfDays').value); show(); };
    drawCharts();
    document.querySelectorAll('[data-ack]').forEach((b) => b.onclick = async () => {
      try { await api(`/kpi-alerts/${encodeURIComponent(b.dataset.ack)}/ack`, { method: 'POST', body: {} }); flash('Alerta marcada como revisada. Queda registrada en la auditoría.', 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    });
    if ($('#cfgForm')) $('#cfgForm').onsubmit = async (ev) => {
      ev.preventDefault();
      const body = {};
      for (const [k, [, mult]] of Object.entries(CFG_LABELS)) body[k] = Number($('#cfg_' + k).value) * mult;
      try { await api('/kpi-alerts/config', { method: 'PUT', body }); flash('Umbrales guardados. Las alertas se recalcularon.', 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    };
    if ($('#tick')) $('#tick').onclick = async () => { try { const r = await api('/runtime/tick', { method: 'POST', body: { advance_hours: 24 } }); flash(`Reloj de la demo adelantado 24 h. Instancias procesadas: ${r.processed}.`, 'ok'); show(); } catch (e) { flash(e.message, 'bad'); } };
    if ($('#gpause')) $('#gpause').onclick = async () => {
      const t = await api('/control-tower');
      try { const r = await api('/runtime/pause', { method: 'POST', body: { paused: !t.global_pause, reason: 'manual desde Control Tower' } }); flash(r.global_pause ? 'Pausa general activa: no se generan nuevos envíos ni otorgamientos.' : 'Envíos reanudados.', r.global_pause ? 'warn' : 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    };
  },
  profile() {
    const open = async (id) => {
      const d = await api('/players/' + encodeURIComponent(id));
      const p = d.profile;
      const f = (label, x) => `<tr><th>${label}</th><td>${esc(x.value)}</td><td class="muted">${esc(x.source)} · ${x.as_of ? new Date(x.as_of).toLocaleString('es-CO') : '—'} · v${x.version}</td></tr>`;
      const ex = d.eligibility_explanation;
      $('#pdetail').innerHTML = `<h3>${esc(p.player_id)} · ${esc(p.brand_id)}</h3>
        <div class="scroll"><table>${f('Email', p.contact.email)}${f('KYC', p.kyc)}${f('Juego responsable', p.rg)}${f('País', p.country)}${f('Zona horaria', p.timezone)}
        ${Object.entries(p.consents).map(([k, v]) => f('Consentimiento ' + k, v)).join('')}</table></div>
        <h3 style="margin-top:12px">Por qué recibe o no marketing</h3>
        ${Object.entries(ex.marketing).map(([c, x]) => `<div><b>${c}</b>: <span class="${x.kind === 'allow' ? 'ok' : x.kind === 'defer' ? 'warn' : 'bad'}">${x.kind}</span> <span class="muted">${x.reasons.map(esc).join(', ')} · política ${esc(x.policy_version)}</span></div>`).join('')}
        <div><b>incentivos</b>: <span class="${ex.incentive.kind === 'allow' ? 'ok' : 'bad'}">${ex.incentive.kind}</span> <span class="muted">${ex.incentive.reasons.map(esc).join(', ')}</span></div>
        <h3 style="margin-top:12px">Segmentación</h3>
        <div class="row"><span class="chip brand">${esc(d.segmentation.lifecycle.label)}</span>${d.segmentation.rfm ? `<span class="chip">RFM ${d.segmentation.rfm.r}-${d.segmentation.rfm.f}-${d.segmentation.rfm.m} · ${esc(d.segmentation.rfm.label)}</span><span class="muted">${d.segmentation.rfm.recency_days} d desde la última actividad · ${d.segmentation.rfm.frequency} depósitos · ${moneyC(d.segmentation.rfm.monetary_minor)}</span>` : '<span class="muted">Sin RFM: aún no deposita</span>'}</div>
        ${d.segmentation.persona ? `<div class="row"><span class="chip">Persona ${esc(d.segmentation.persona.id)}: ${esc(d.segmentation.persona.name)}</span></div>` : ''}
        ${d.segmentation.nba ? `<h3 style="margin-top:12px">Mejor acción siguiente</h3>
          <div class="row"><span class="chip brand">${esc(d.segmentation.nba.chosen.label)}</span>${d.segmentation.nba.chosen.expected_value_minor ? `<span class="muted">valor esperado ${moneyC(d.segmentation.nba.chosen.expected_value_minor)}</span>` : ''}<span class="muted">${esc(d.segmentation.nba.chosen.why)}</span></div>
          ${d.segmentation.nba.candidates.length > 1 ? `<div class="muted">Alternativas: ${d.segmentation.nba.candidates.filter((c) => c.action !== d.segmentation.nba.chosen.action).map((c) => `${esc(c.label)} (${c.allowed ? moneyC(c.expected_value_minor) : 'bloqueada: ' + esc((c.blocked_by ?? []).join(', '))})`).join(' · ')}</div>` : ''}
          <div class="muted">${esc(d.segmentation.nba.note)}</div>` : ''}
        ${(() => { const pr = d.segmentation.predictions; if (!pr) return ''; const P = (x) => x ? pct(x.p, 0) : '—';
          return `<h3 style="margin-top:12px">Predicciones</h3>
          <div class="row">${pr.vip_early ? '<span class="chip brand">VIP temprano</span>' : ''}${pr.promo_eligible ? '' : '<span class="chip bad">No elegible para promoción (juego responsable)</span>'}
            <span class="chip">Abandono ${P(pr.churn)}</span><span class="chip">Depósito en 30 d ${P(pr.deposit)}</span><span class="chip">Valor 30 d ${moneyC(pr.value_30d_minor)}</span>
            ${pr.preferences.product ? `<span class="chip">Prefiere ${esc(pr.preferences.product)}${pr.preferences.daypart ? ' · ' + esc(pr.preferences.daypart) : ''}</span>` : ''}</div>
          ${pr.churn ? `<div class="muted">Por qué ese riesgo: ${pr.churn.reasons.map(esc).join(' · ')}</div>` : ''}`; })()}
        ${d.loyalty ? `<h3 style="margin-top:12px">Fidelidad</h3>${esc(d.loyalty.level)} · ${d.loyalty.points} pts · ${d.loyalty.percent_to_next}% hacia ${esc(d.loyalty.next_level ?? '—')}` : ''}
        <h3 style="margin-top:12px">Recompensas</h3>${d.grants.map((g) => `<span class="chip">${esc(g.reward_id)} · ${esc(g.status)}</span>`).join('') || '<span class="muted">—</span>'}
        <h3 style="margin-top:12px">Mensajes</h3>${d.receipts.map((r) => `<div>${esc(r.channel)} · ${esc(r.template)} · <span class="${r.status === 'accepted' ? 'ok' : 'bad'}">${esc(r.status)}</span> <span class="muted">${esc(r.reason ?? '')}</span></div>`).join('') || '<span class="muted">—</span>'}
        <h3 style="margin-top:12px">Línea de tiempo</h3><div class="scroll"><table>${p.timeline.map((t) => `<tr><td class="muted">${new Date(t.occurred_at).toLocaleString('es-CO')}</td><td>${esc(t.event_type)}</td><td class="muted">${esc(t.source)}</td></tr>`).join('')}</table></div>`;
    };
    document.querySelectorAll('[data-p]').forEach((a) => a.onclick = (e) => { e.preventDefault(); open(a.dataset.p); });
    $('#pgo').onclick = () => open($('#pq').value.trim());
  },
  segments() {
    document.querySelectorAll('[data-use]').forEach((b) => b.onclick = () => {
      $('#rules').value = JSON.stringify(JSON.parse(b.dataset.use), null, 2);
      $('#rules').scrollIntoView({ behavior: 'smooth', block: 'center' }); $('#prev').click();
    });
    $('#prev').onclick = async () => {
      try {
        const excl = $('#excl').value.trim();
        const r = await api('/segments/preview', { method: 'POST', body: { rules: JSON.parse($('#rules').value), exclusions: excl ? JSON.parse(excl) : undefined } });
        $('#segout').innerHTML = `<div class="grid" style="margin-top:10px"><div class="card"><h3>Tamaño</h3><div class="kpi">${r.size}</div></div><div class="card"><h3>Excluidos</h3><div class="kpi">${r.excluded}</div></div><div class="card"><h3>Universo</h3><div class="kpi">${r.universe}</div></div></div><p class="muted">Snapshot ${esc(r.snapshot_hash.slice(0, 12))}. La elegibilidad se revalida al ejecutar.</p>`;
      } catch (e) { $('#segout').innerHTML = `<p class="bad">${esc(e.message)} ${esc(JSON.stringify(e.data?.errors ?? ''))}</p>`; }
    };
  },
  builder() {
    document.querySelectorAll('[data-sim]').forEach((b) => b.onclick = async () => {
      const id = b.dataset.sim;
      const pid = document.querySelector(`[data-simp="${id}"]`).value;
      const r = await api(`/journeys/${id}/simulate`, { method: 'POST', body: { player_id: pid, payload: { level: 'Plata', season: '2026-Q4', percent: 55, grant_id: 'sim', reward_type: 'free_spins', value: { amount_minor: 100000, currency: 'COP' }, expires_at: '2026-12-31T00:00:00Z' } } });
      document.querySelector(`[data-simout="${id}"]`).innerHTML = `<pre class="trace">${esc(r.trace.map((s) => `${s.node.padEnd(14)} ${s.type.padEnd(12)} ${s.outcome}${s.decision ? '  ← ' + s.decision.reasons.join(',') : ''}`).join('\n'))}\n→ ${esc(r.status)} (sin efectos externos)</pre>`;
    });
    const act = (attr, action) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.onclick = async () => {
      try { await api(`/journeys/${b.dataset[attr]}/${action}`, { method: 'POST', body: { reason: 'manual' } }); flash(action === 'pause' ? 'Recorrido en pausa: las instancias quedan esperando.' : 'Recorrido reanudado.', 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    act('pause', 'pause'); act('resume', 'resume');
    if (!$('#savedraft')) return;
    $('#savedraft').onclick = async () => {
      try { const d = await api('/journeys', { method: 'POST', body: JSON.parse($('#draft').value) }); $('#draftout').innerHTML = `<p class="ok">Borrador ${esc(d.id)} v${d.version} guardado.</p>`; }
      catch (e) { $('#draftout').innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
    };
    $('#submit').onclick = async () => {
      try { const d = await api(`/journeys/${JSON.parse($('#draft').value).id}/submit`, { method: 'POST' }); $('#draftout').innerHTML = `<p class="ok">v${d.version} enviado a aprobación. Cambia al rol «Aprobador».</p>`; }
      catch (e) { $('#draftout').innerHTML = `<p class="bad">${esc(e.message)}</p>`; }
    };
  },
  approval() {
    const act = (attr, action) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => b.onclick = async () => {
      try { await api(`/journeys/${b.dataset[attr]}/${action}`, { method: 'POST' }); flash(action === 'approve' ? 'Aprobado y firmado. Ya se puede publicar.' : 'Publicado. Las nuevas instancias usan esta versión.', 'ok'); show(); } catch (e) { flash(e.message, 'bad'); }
    });
    act('approve', 'approve'); act('publish', 'publish');
  },
  loyalty() {
    const load = async () => {
      const d = await api('/players/' + encodeURIComponent($('#lp').value));
      const l = d.loyalty;
      $('#lout').innerHTML = `<div class="phone">
        <div class="muted">RumbaWin · Temporada ${esc(l.season)}</div>
        <h2 style="margin:6px 0">Nivel ${esc(l.level)}</h2>
        <div class="bar" role="progressbar" aria-valuenow="${l.percent_to_next}" aria-valuemin="0" aria-valuemax="100" aria-label="Progreso al siguiente nivel"><span style="width:${l.percent_to_next}%"></span></div>
        <p>${l.next_level ? `${l.percent_to_next} % hacia <b>${esc(l.next_level)}</b> · faltan ${l.points_to_next} pts` : 'Nivel máximo'}</p>
        <h3>Recompensas</h3>${(() => {
          const asOf = d.as_of ? Date.parse(d.as_of) : Date.now();
          const rs = [...d.profile.rewards].sort((a, b) => b.expires_at.localeCompare(a.expires_at));
          const active = rs.filter((r) => Date.parse(r.expires_at) > asOf), expired = rs.filter((r) => Date.parse(r.expires_at) <= asOf);
          const card = (r, exp) => `<div class="card" style="margin-bottom:6px${exp ? ';opacity:.55' : ''}">${esc(r.reward_type)} · ${money(r.amount_minor, r.currency)}<br><span class="muted">${exp ? 'Venció' : 'Vence'} ${new Date(r.expires_at).toLocaleDateString('es-CO')}</span></div>`;
          return (active.map((r) => card(r, false)).join('') || '<p class="muted">Sin recompensas vigentes</p>') + (expired.length ? `<details><summary>Vencidas (${expired.length})</summary>${expired.map((r) => card(r, true)).join('')}</details>` : '');
        })()}
        <h3>Movimientos</h3>${l.movements.slice(-6).reverse().map((m) => `<div>${m.points > 0 ? '+' : ''}${m.points} pts <span class="muted">${esc(m.reason)}</span></div>`).join('') || '<p class="muted">—</p>'}
        <h3>Misiones</h3>${d.gamification.opt_out ? '<p class="muted">Gamificación desactivada por el jugador.</p>' : d.gamification.missions.length ? d.gamification.missions.map((m) => {
          const pctv = Math.min(100, Math.round(100 * m.value / m.target));
          return `<div style="margin-bottom:10px"><div><b>${esc(m.name)}</b> ${m.completed_at ? '<span class="chip brand">Completada</span>' : m.eligible ? '' : '<span class="chip">No disponible</span>'}</div><div class="muted">${esc(m.description)}</div>
            <div class="bar" role="progressbar" aria-valuenow="${pctv}" aria-valuemin="0" aria-valuemax="100" aria-label="${esc(m.name)}"><span style="width:${pctv}%"></span></div>
            <div class="muted">${m.kind === 'sum' ? `${moneyC(m.value)} de ${moneyC(m.target)}` : `${int(m.value)} de ${int(m.target)}${m.kind === 'streak' ? ' días seguidos' : ''}`} · ${m.reward.xp ? `${int(m.reward.xp)} XP` : 'bono'}</div></div>`; }).join('') : '<p class="muted">Sin misiones activas.</p>'}
        <h3>Logros</h3><div class="row">${d.gamification.badge_catalog.map((b) => { const got = d.gamification.badges.find((x) => x.id === b.id); return `<span class="chip ${got ? 'brand' : ''}" style="${got ? '' : 'opacity:.45'}" title="${esc(b.description)}">${esc(b.name)}</span>`; }).join('')}</div>
        <h3>Preferencias</h3><label><input type="checkbox" id="optin" ${d.gamification.opt_out ? '' : 'checked'} ${can('player.preferences') ? '' : 'disabled'}> Recibir avisos de progreso y misiones</label>
        ${can('player.preferences') ? '' : '<p class="muted">Solo soporte o administración pueden cambiarla desde el backoffice.</p>'}</div>`;
      if ($('#optin')) $('#optin').onchange = async () => {
        try { await api(`/players/${encodeURIComponent($('#lp').value)}/gamification-preference`, { method: 'POST', body: { opt_out: !$('#optin').checked } }); flash($('#optin').checked ? 'Gamificación activada para el jugador.' : 'Gamificación desactivada: sin misiones ni avisos de progreso.', 'ok'); load(); }
        catch (e) { flash(e.message, 'bad'); }
      };
    };
    $('#lp').onchange = load; load();
  },
  gamification() {
    document.querySelectorAll('[data-mact]').forEach((b) => b.onclick = async () => {
      try { const m = await api(`/gamification/missions/${b.dataset.mid}/${b.dataset.mact}`, { method: 'POST' }); flash(m.status === 'pending_approval' ? 'Misión enviada a aprobación. La activa otra persona con rol Aprobador.' : m.status === 'active' ? 'Misión activa.' : 'Misión en pausa.', 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    });
    if ($('#msave')) $('#msave').onclick = async () => {
      try { const m = await api('/gamification/missions', { method: 'POST', body: JSON.parse($('#mdraft').value) }); flash(`Borrador «${m.name}» guardado.`, 'ok'); show(); }
      catch (e) { flash(e.message, 'bad'); }
    };
  },
  analytics() {
    document.querySelectorAll('[data-nba]').forEach((b) => b.onclick = () => openSegmentWith(JSON.parse(b.dataset.nba)));
  },
  copilot() {
    const samples = { query_metric: { metric: 'kyc_verified_rate' }, preview_segment: { rules: { field: 'kyc', op: 'eq', value: 'verified' }, exclusions: { field: 'rg', op: 'neq', value: 'none' } }, validate_policy: { journey: { id: 'j_demo', purpose: 'marketing', trigger: { event_type: 'deposit.settled' }, entry: 'm', nodes: [{ id: 'm', type: 'message', channel: 'inapp', template: 'loyalty_halfway', next: 'e' }, { id: 'e', type: 'exit' }] } } };
    samples.simulate_journey = { ...samples.validate_policy, synthetic_profile: { rg: 'self_excluded' } };
    samples.save_draft = samples.validate_policy;
    const fill = () => { $('#tin').value = JSON.stringify(samples[$('#tool').value] ?? {}, null, 2); };
    if ($('#tool')) { $('#tool').onchange = fill; fill(); }
    $('#call').onclick = async () => { try { $('#cout').textContent = JSON.stringify(await api('/copilot/tools/' + $('#tool').value, { method: 'POST', body: JSON.parse($('#tin').value) }), null, 2); } catch (e) { $('#cout').textContent = e.message; } };
    if ($('#ask')) $('#ask').onclick = async () => { $('#cout').textContent = 'Consultando…'; try { $('#cout').textContent = JSON.stringify(await api('/copilot/ask', { method: 'POST', body: { question: $('#q').value } }), null, 2); } catch (e) { $('#cout').textContent = e.message; } };
  },
};

async function boot() {
  flash('');
  try { await loadSession(); } catch (e) { flash(e.message, 'bad'); }
  renderTabs(); show();
}
if (window.SS1_STATIC) $('#mode').hidden = false;
$('#tenant').onchange = boot; $('#role').onchange = boot;
if (!EMBED.active) boot();
else {
  $('#view').innerHTML = '<p class="waiting">Esperando la sesión de admin.syssoft1.com…</p>';
  setTimeout(() => { if (!EMBED.session) $('#view').innerHTML = '<div class="card bad">No se recibió la sesión del admin. Abre el CRM desde admin.syssoft1.com con un usuario autorizado.</div>'; }, 8000);
}
</script>
